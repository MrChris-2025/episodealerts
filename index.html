<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>CineWave - Animated Media Gallery</title>
  
  <!-- Web App Manifest & Theme -->
  <link rel="manifest" href="/manifest.json" />
  <meta name="theme-color" content="#1e293b" />
  <link rel="apple-touch-icon" href="/icon-192x192.png" />

  <link rel="stylesheet" href="styles.css" />
  <!-- Parse JavaScript SDK -->
  <script src="https://npmcdn.com/parse/dist/parse.min.js"></script>
</head>
<body>

  <header class="navbar">
    <div class="logo">🍿 CineWave</div>
    <div class="tab-controls">
      <button id="tabTv" class="tab-btn active" onclick="switchMediaType('tv')">TV Shows (TVmaze)</button>
      <button id="tabMovie" class="tab-btn" onclick="switchMediaType('movie')">Movies (TMDB)</button>
    </div>
  </header>

  <main class="container">
    <section class="controls-panel">
      <div class="search-box">
        <input type="text" id="searchInput" placeholder="Search shows or movies..." onkeyup="handleSearch()" />
      </div>

      <div class="filter-group">
        <select id="genreSelect" onchange="applyFilters()">
          <option value="">All Genres</option>
          <option value="Action">Action</option>
          <option value="Comedy">Comedy</option>
          <option value="Drama">Drama</option>
          <option value="Fantasy">Fantasy</option>
          <option value="Horror">Horror</option>
          <option value="Romance">Romance</option>
          <option value="Sci-Fi">Sci-Fi / Science-Fiction</option>
          <option value="Thriller">Thriller</option>
        </select>

        <select id="yearSelect" onchange="applyFilters()">
          <option value="">All Years</option>
        </select>
      </div>
    </section>

    <!-- Dynamic Animated Grid Gallery -->
    <section id="gallery" class="gallery-grid"></section>
  </main>

  <script src="app.js"></script>
</body>
</html>
