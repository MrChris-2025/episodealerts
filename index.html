<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <link rel="manifest" href="manifest.json" />
  <meta name="theme-color" content="#0a0a0c" />
  <link rel="icon" href="./icon-512.png" type="image/png" />
  <title>CinemaDash | Track Your Shows</title>
  
  <!-- Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  
  <script src="https://npmcdn.com/parse/dist/parse.min.js"></script>

  <style>
    :root {
      --bg: #0a0a0c;
      --card-bg: #16161a;
      --accent: #3d5afe;
      --accent-hover: #536dfe;
      --text-main: #ffffff;
      --text-dim: #a1a1aa;
      --danger: #ef4444;
      --success: #22c55e;
    }

    * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }

    body {
      margin: 0;
      font-family: 'Poppins', sans-serif;
      background-color: var(--bg);
      color: var(--text-main);
      line-height: 1.5;
    }

    /* Layout Containers */
    .container { max-width: 1300px; margin: 0 auto; padding: 0 20px; }

    header {
      background: rgba(10, 10, 12, 0.8);
      backdrop-filter: blur(20px);
      position: sticky;
      top: 0;
      z-index: 100;
      padding: 20px 0;
      border-bottom: 1px solid #27272a;
    }

    header .nav-flex {
      display: flex;
      justify-content: space-between;
      align-items: center;
      flex-wrap: wrap;
      gap: 20px;
    }

    h1 { margin: 0; font-size: 1.6rem; font-weight: 700; letter-spacing: -0.5px; }
    h1 span { color: var(--accent); }

    /* Search Bar UI */
    .search-group {
      display: flex;
      background: #1c1c21;
      border-radius: 12px;
      padding: 5px;
      border: 1px solid #27272a;
      flex-grow: 1;
      max-width: 600px;
    }

    .search-group input {
      background: transparent;
      border: none;
      color: #fff;
      padding: 10px 15px;
      flex-grow: 1;
      font-family: inherit;
      outline: none;
    }

    .search-group select {
      background: #27272a;
      border: none;
      color: #fff;
      border-radius: 8px;
      padding: 0 10px;
      margin-right: 5px;
      cursor: pointer;
    }

    .btn-primary {
      background: var(--accent);
      color: white;
      border: none;
      padding: 10px 20px;
      border-radius: 8px;
      font-weight: 600;
      cursor: pointer;
      transition: 0.2s;
    }

    .btn-primary:hover { background: var(--accent-hover); }

    /* Section Headers */
    .section-label {
      margin: 40px 0 20px;
      font-size: 1.1rem;
      font-weight: 600;
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .section-label::after {
      content: '';
      height: 1px;
      background: #27272a;
      flex-grow: 1;
    }

    /* Tracked Cards Dashboard */
    .tracked-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
      gap: 20px;
    }

    .tracked-card {
      background: var(--card-bg);
      border-radius: 16px;
      padding: 20px;
      border: 1px solid #27272a;
      display: flex;
      flex-direction: column;
      gap: 12px;
      position: relative;
    }

    .tracked-card .title { font-weight: 600; font-size: 1.1rem; color: #fff; padding-right: 30px; }
    
    .status-badge {
      font-size: 0.75rem;
      padding: 4px 10px;
      border-radius: 20px;
      background: #27272a;
      color: var(--text-dim);
      width: fit-content;
    }

    .episode-info {
      background: #1c1c21;
      border-radius: 8px;
      padding: 10px;
      font-size: 0.85rem;
    }

    .episode-info div { display: flex; justify-content: space-between; margin-bottom: 4px; }
    .episode-info span { color: var(--text-dim); }
    .episode-info b { color: var(--accent); }

    .btn-delete {
      position: absolute;
      top: 15px;
      right: 15px;
      background: rgba(239, 68, 68, 0.1);
      border: none;
      color: var(--danger);
      width: 32px;
      height: 32px;
      border-radius: 8px;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      font-weight: bold;
      transition: 0.2s;
    }

    .btn-delete:hover { background: var(--danger); color: white; }

    /* Main Gallery Grid */
    .gallery {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(200px, 1fr));
      gap: 25px;
      padding-bottom: 50px;
    }

    .movie-card {
      background: var(--card-bg);
      border-radius: 12px;
      overflow: hidden;
      transition: transform 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275);
    }

    .movie-card:hover { transform: scale(1.03); }

    .poster-wrap { position: relative; aspect-ratio: 2/3; background: #27272a; }
    .poster-wrap img { width: 100%; height: 100%; object-fit: cover; }

    .card-content { padding: 15px; }
    .card-title { font-weight: 600; font-size: 0.95rem; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .card-meta { font-size: 0.8rem; color: var(--text-dim); margin-bottom: 12px; }

    .btn-subscribe {
      width: 100%;
      background: #27272a;
      border: 1px solid #3f3f46;
      color: white;
      padding: 8px;
      border-radius: 8px;
      font-size: 0.85rem;
      font-weight: 500;
      cursor: pointer;
    }

    .btn-subscribe:hover { background: #3f3f46; }
    .btn-subscribe.active { background: var(--success); border-color: var(--success); cursor: default; }

    /* Empty States */
    .empty-msg { text-align: center; color: var(--text-dim); padding: 40px; grid-column: 1/-1; }

    @media (max-width: 768px) {
      .gallery { grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); }
    }
  </style>
</head>
<body>

  <header>
    <div class="container nav-flex">
      <h1>Cinema<span>Dash</span></h1>
      <div class="search-group">
        <input type="text" id="searchInput" placeholder="Search for a show or movie..." />
        <select id="genreSelect"><option value="">All Genres</option></select>
        <button class="btn-primary" onclick="performSearch()">Search</button>
      </div>
    </div>
  </header>

  <main class="container">
    <!-- DASHBOARD: TRACKED SHOWS -->
    <div id="trackedSection" style="display:none;">
      <div class="section-label">Your Tracked Subscriptions</div>
      <div class="tracked-grid" id="trackedGrid"></div>
    </div>

    <!-- MAIN EXPLORE GALLERY -->
    <div class="section-label">Explore Content</div>
    <div class="gallery" id="gallery">
      <div class="empty-msg">Waking up the database...</div>
    </div>
  </main>

  <script>
    const PARSE_APP_ID = 'gH0Ry12pUmKdlIWwjbDtN5T8lCkoZnfD6Xp9rvoq';
    const PARSE_JS_KEY = 'bSh7EVVqy3oQMUup6qDZQBVax28RmVeGgE92tMlp';
    const TMDB_KEY = '1070730380f5fee0d87cf0382670b255';
    const VAPID_PUBLIC_KEY = 'BC-LY0azo2sZzvZ4ZoQnZwnpLpIwhrOFsDTQ9YbiuSdWLNqKQYdNGmMM9Am6IH-Zd9rBPg7gcXOEYiFyNsz2Fh8';

    Parse.initialize(PARSE_APP_ID, PARSE_JS_KEY);
    Parse.serverURL = 'https://parseapi.back4app.com/';

    let swReg = null;
    if ('serviceWorker' in navigator) {
      navigator.serviceWorker.register('sw.js').then(reg => swReg = reg);
    }

    // Local Storage Helpers
    const getLocalSubs = () => JSON.parse(localStorage.getItem('my_subs') || '[]');
    const saveLocalSub = (id) => {
      const s = getLocalSubs();
      if(!s.includes(id)) { s.push(id); localStorage.setItem('my_subs', JSON.stringify(s)); }
    };
    const removeLocalSub = (id) => {
      const s = getLocalSubs().filter(i => i != id);
      localStorage.setItem('my_subs', JSON.stringify(s));
    };

    /**
     * LOAD DASHBOARD DATA
     * Fetches details from TMDB for each unique subscription
     */
    async function loadDashboard() {
      const grid = document.getElementById('trackedGrid');
      const section = document.getElementById('trackedSection');
      
      try {
        const subs = await Parse.Cloud.run('getRecentSubscriptions');
        if (!subs || subs.length === 0) {
          section.style.display = 'none';
          return;
        }

        section.style.display = 'block';
        grid.innerHTML = '';

        // Fetch TMDB data for each show to get Last/Next Episode
        for (const show of subs) {
          const res = await fetch(`https://api.themoviedb.org/3/tv/${show.showId}?api_key=${TMDB_KEY}`);
          const details = await res.json();
          
          const card = document.createElement('div');
          card.className = 'tracked-card';
          
          const lastEp = details.last_episode_to_air ? details.last_episode_to_air.air_date : 'N/A';
          const nextEp = details.next_episode_to_air ? details.next_episode_to_air.air_date : 'TBA';
          
          card.innerHTML = `
            <button class="btn-delete" onclick="unsubscribe('${show.showId}')" title="Unsubscribe">×</button>
            <div class="status-badge">Alerts Enabled</div>
            <div class="title">${show.showName}</div>
            <div class="episode-info">
              <div><span>Last Aired:</span> <b>${lastEp}</b></div>
              <div><span>Next Episode:</span> <b>${nextEp}</b></div>
            </div>
          `;
          grid.appendChild(card);
        }
      } catch (err) { console.error("Dash error:", err); }
    }

    async function subscribe(id, name, btn) {
      if (!swReg) return alert("Push not supported.");
      try {
        const permission = await Notification.requestPermission();
        if (permission !== 'granted') return;

        btn.disabled = true;
        btn.textContent = "Syncing...";

        const subObj = await swReg.pushManager.subscribe({
          userVisibleOnly: true,
          applicationServerKey: urlB64ToUint8Array(VAPID_PUBLIC_KEY)
        });

        const PSub = Parse.Object.extend("PushSubscription");
        const ps = new PSub();
        ps.set("subscriptionObject", JSON.parse(JSON.stringify(subObj)));
        ps.set("showId", id.toString());
        ps.set("showName", name);
        await ps.save();

        saveLocalSub(id.toString());
        btn.textContent = "Tracked ✓";
        btn.classList.add('active');
        loadDashboard();
      } catch (e) { 
        console.error(e);
        btn.disabled = false;
        btn.textContent = "Try Again";
      }
    }

    async function unsubscribe(showId) {
      if(!confirm("Stop alerts for this show?")) return;
      try {
        await Parse.Cloud.run('deleteSubscription', { showId });
        removeLocalSub(showId);
        loadDashboard();
        performSearch(); // Refresh gallery buttons
      } catch (e) { alert("Failed to delete."); }
    }

    // Standard TMDB Logic
    async function performSearch() {
      const q = document.getElementById('searchInput').value.trim();
      const g = document.getElementById('genreSelect').value;
      const gallery = document.getElementById('gallery');
      const localSubs = getLocalSubs();
      
      gallery.innerHTML = '<div class="empty-msg">Searching content...</div>';
      
      let results = [];
      try {
        if (q) {
          const res = await fetch(`https://api.themoviedb.org/3/search/multi?api_key=${TMDB_KEY}&query=${encodeURIComponent(q)}`);
          const data = await res.json();
          results = data.results.filter(i => i.media_type !== 'person');
        } else {
          const res = await fetch(`https://api.themoviedb.org/3/trending/all/week?api_key=${TMDB_KEY}`);
          const data = await res.json();
          results = data.results;
        }

        gallery.innerHTML = '';
        results.forEach(item => {
          const isTV = item.media_type === 'tv' || (!item.media_type && item.first_air_date);
          const name = item.name || item.title;
          const date = (item.first_air_date || item.release_date || '').split('-')[0];
          const img = item.poster_path ? `https://image.tmdb.org/t/p/w500${item.poster_path}` : 'https://via.placeholder.com/500x750?text=No+Image';
          
          const card = document.createElement('div');
          card.className = 'movie-card';

          let actionHtml = '';
          if (isTV) {
            const isTracked = localSubs.includes(item.id.toString());
            actionHtml = isTracked 
              ? `<button class="btn-subscribe active" disabled>Tracked ✓</button>`
              : `<button class="btn-subscribe" onclick="subscribe('${item.id}', '${name.replace(/'/g, "\\'")}', this)">Track Episodes</button>`;
          }

          card.innerHTML = `
            <div class="poster-wrap"><img src="${img}" loading="lazy"></div>
            <div class="card-content">
              <div class="card-title">${name}</div>
              <div class="card-meta">${isTV ? 'TV Series' : 'Movie'} • ${date || 'TBA'}</div>
              ${actionHtml}
            </div>
          `;
          gallery.appendChild(card);
        });
      } catch (e) { gallery.innerHTML = '<div class="empty-msg">Failed to load content.</div>'; }
    }

    function urlB64ToUint8Array(base64String) {
      const padding = '='.repeat((4 - base64String.length % 4) % 4);
      const base64 = (base64String + padding).replace(/\-/g, '+').replace(/_/g, '/');
      const rawData = window.atob(base64);
      const outputArray = new Uint8Array(rawData.length);
      for (let i = 0; i < rawData.length; ++i) { outputArray[i] = rawData.charCodeAt(i); }
      return outputArray;
    }

    async function init() {
      // Load Genres
      const res = await fetch(`https://api.themoviedb.org/3/genre/tv/list?api_key=${TMDB_KEY}`);
      const data = await res.json();
      const sel = document.getElementById('genreSelect');
      data.genres.forEach(gen => {
        const opt = document.createElement('option');
        opt.value = gen.id; opt.textContent = gen.name;
        sel.appendChild(opt);
      });

      performSearch();
      loadDashboard();
    }

    window.onload = init;
  </script>
</body>
</html>
