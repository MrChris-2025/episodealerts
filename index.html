<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>

     <link rel="manifest" href="./manifest.json" />
  <meta name="theme-color" content="#0d1117" />
  <link rel="icon" href="./icon-512.png" type="image/png" />

    
  <title>Movie & TV Glass Gallery</title>
  
  <!-- Parse SDK -->
  <script src="https://npmcdn.com/parse/dist/parse.min.js"></script>

  <style>
    :root {
      --glass-bg: rgba(255, 255, 255, 0.1);
      --glass-border: rgba(255, 255, 255, 0.2);
      --glass-blur: blur(12px);
    }
    
    body {
      margin: 0;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      background: linear-gradient(135deg, #1f1c2c, #928dab);
      background-attachment: fixed;
      color: #fff;
      min-height: 100vh;
    }

    /* Glassmorphism Header */
    header {
      position: sticky;
      top: 0;
      z-index: 10;
      background: var(--glass-bg);
      backdrop-filter: var(--glass-blur);
      -webkit-backdrop-filter: var(--glass-blur);
      border-bottom: 1px solid var(--glass-border);
      padding: 15px 20px;
      display: flex;
      flex-wrap: wrap;
      gap: 15px;
      align-items: center;
      justify-content: space-between;
    }

    header h1 {
      margin: 0;
      font-size: 1.5rem;
      text-shadow: 0 2px 4px rgba(0,0,0,0.3);
    }

    .controls {
      display: flex;
      gap: 10px;
      flex-wrap: wrap;
    }

    input, select, button {
      background: rgba(255, 255, 255, 0.15);
      border: 1px solid var(--glass-border);
      color: #fff;
      padding: 8px 12px;
      border-radius: 8px;
      outline: none;
      backdrop-filter: var(--glass-blur);
    }

    input::placeholder { color: #ddd; }
    
    option { background: #2c293c; color: #fff; }

    button {
      cursor: pointer;
      transition: background 0.3s;
      font-weight: bold;
    }

    button:hover { background: rgba(255, 255, 255, 0.3); }

    /* Gallery Grid */
    .gallery {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(200px, 1fr));
      gap: 20px;
      padding: 20px;
      max-width: 1200px;
      margin: 0 auto;
    }

    .card {
      background: var(--glass-bg);
      backdrop-filter: var(--glass-blur);
      -webkit-backdrop-filter: var(--glass-blur);
      border: 1px solid var(--glass-border);
      border-radius: 16px;
      overflow: hidden;
      display: flex;
      flex-direction: column;
      transition: transform 0.3s;
      box-shadow: 0 8px 32px 0 rgba(0, 0, 0, 0.3);
    }

    .card:hover { transform: translateY(-5px); }

    .card img {
      width: 100%;
      height: 300px;
      object-fit: cover;
      background: #333;
    }

    .card-info {
      padding: 15px;
      display: flex;
      flex-direction: column;
      flex-grow: 1;
      justify-content: space-between;
    }

    .card-title {
      font-size: 1.1rem;
      font-weight: 600;
      margin-bottom: 5px;
    }

    .card-type {
      font-size: 0.8rem;
      color: #ddd;
      margin-bottom: 10px;
      text-transform: uppercase;
      letter-spacing: 1px;
    }

    .subscribe-btn {
      background: linear-gradient(135deg, #00c6ff, #0072ff);
      border: none;
      width: 100%;
      padding: 10px;
      border-radius: 8px;
      margin-top: 10px;
      box-shadow: 0 4px 15px rgba(0,114,255,0.4);
    }

    .subscribe-btn:hover { background: linear-gradient(135deg, #0072ff, #00c6ff); }
  </style>
</head>
<body>

  <header>
    <h1>GlassGallery</h1>
    <div class="controls">
      <input type="text" id="searchInput" placeholder="Search movies & TV..." />
      <select id="genreSelect">
        <option value="">All Genres</option>
        <option value="28">Action</option>
        <option value="35">Comedy</option>
        <option value="18">Drama</option>
        <option value="10765">Sci-Fi & Fantasy</option>
      </select>
      <select id="yearSelect">
        <option value="">Any Year</option>
        <option value="2026">2026</option>
        <option value="2025">2025</option>
        <option value="2024">2024</option>
        <option value="2023">2023</option>
      </select>
      <button onclick="performSearch()">Search</button>
    </div>
  </header>

  <div class="gallery" id="gallery"></div>

  <script>
    // Configuration Keys
    const PARSE_APP_ID = 'gH0Ry12pUmKdlIWwjbDtN5T8lCkoZnfD6Xp9rvoq';
    const PARSE_JS_KEY = 'bSh7EVVqy3oQMUup6qDZQBVax28RmVeGgE92tMlp';
    const TMDB_KEY = '1070730380f5fee0d87cf0382670b255';
    const VAPID_PUBLIC_KEY = 'BC-LY0azo2sZzvZ4ZoQnZwnpLpIwhrOFsDTQ9YbiuSdWLNqKQYdNGmMM9Am6IH-Zd9rBPg7gcXOEYiFyNsz2Fh8';

    // Initialize Parse
    Parse.initialize(PARSE_APP_ID, PARSE_JS_KEY);
    Parse.serverURL = 'https://parseapi.back4app.com/';

    // Service Worker Registration for PWA Push
    let swRegistration = null;
    if ('serviceWorker' in navigator && 'PushManager' in window) {
      navigator.serviceWorker.register('sw.js')
      .then(swReg => { swRegistration = swReg; })
      .catch(error => { console.error('Service Worker Error', error); });
    }

    // Utility: Convert VAPID key to Uint8Array
    function urlB64ToUint8Array(base64String) {
      const padding = '='.repeat((4 - base64String.length % 4) % 4);
      const base64 = (base64String + padding).replace(/\-/g, '+').replace(/_/g, '/');
      const rawData = window.atob(base64);
      const outputArray = new Uint8Array(rawData.length);
      for (let i = 0; i < rawData.length; ++i) {
        outputArray[i] = rawData.charCodeAt(i);
      }
      return outputArray;
    }

    // Subscribe to TV Show Alerts
    async function subscribeToAlerts(showId, showName) {
      if (!swRegistration) return alert('Service worker not registered.');

      try {
        const permission = await Notification.requestPermission();
        if (permission !== 'granted') return alert('Notifications denied.');

        const applicationServerKey = urlB64ToUint8Array(VAPID_PUBLIC_KEY);
        const subscription = await swRegistration.pushManager.subscribe({
          userVisibleOnly: true,
          applicationServerKey: applicationServerKey
        });

        // Save to Parse Backend (Triggers 'PushSubscription' Cloud Code)
        const PushSubClass = Parse.Object.extend("PushSubscription");
        const newSub = new PushSubClass();
        newSub.set("subscriptionObject", JSON.parse(JSON.stringify(subscription)));
        newSub.set("showId", showId.toString());
        newSub.set("showName", showName);
        
        await newSub.save();
        alert(`Successfully subscribed to alerts for ${showName}!`);
      } catch (err) {
        console.error('Subscription error:', err);
        alert('Failed to subscribe.');
      }
    }

    // Render Gallery UI
    function renderGallery(results) {
      const gallery = document.getElementById('gallery');
      gallery.innerHTML = '';

      results.forEach(item => {
        const title = item.title || item.name;
        const type = item.media_type === 'movie' ? 'Movie' : 'TV Show';
        const imgPath = item.poster_path ? `https://image.tmdb.org/t/p/w500${item.poster_path}` : 'https://via.placeholder.com/500x750?text=No+Image';
        
        const card = document.createElement('div');
        card.className = 'card';

        let subButtonHTML = '';
        // Only allow subscription for TV Shows
        if (item.media_type === 'tv' || !item.media_type) {
          subButtonHTML = `<button class="subscribe-btn" onclick="subscribeToAlerts('${item.id}', '${title.replace(/'/g, "\\'")}')">Subscribe Alerts</button>`;
        }

        card.innerHTML = `
          <img src="${imgPath}" alt="${title}" loading="lazy"/>
          <div class="card-info">
            <div>
              <div class="card-title">${title}</div>
              <div class="card-type">${type} | ${item.release_date || item.first_air_date || 'N/A'}</div>
            </div>
            ${subButtonHTML}
          </div>
        `;
        gallery.appendChild(card);
      });
    }

    // TMDB API Fetch Logic
    async function performSearch() {
      const query = document.getElementById('searchInput').value;
      const genre = document.getElementById('genreSelect').value;
      const year = document.getElementById('yearSelect').value;
      
      let url = '';

      if (query) {
        url = `https://api.themoviedb.org/3/search/multi?api_key=${TMDB_KEY}&query=${encodeURIComponent(query)}&include_adult=false`;
      } else {
        // Fallback to discover if no direct text query
        let params = `api_key=${TMDB_KEY}&sort_by=popularity.desc`;
        if (genre) params += `&with_genres=${genre}`;
        if (year) params += `&first_air_date_year=${year}&primary_release_year=${year}`;
        url = `https://api.themoviedb.org/3/discover/tv?${params}`;
      }

      try {
        const response = await fetch(url);
        const data = await response.json();
        // Filter out people from multi-search
        const filtered = data.results.filter(r => r.media_type !== 'person');
        renderGallery(filtered);
      } catch (err) {
        console.error('TMDB Error', err);
      }
    }

    // Initial Load
    window.onload = () => performSearch();
  </script>
</body>
</html>
