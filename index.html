<!DOCTYPE html>
<html lang="en" class="h-full bg-slate-950 text-slate-100">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>CineAlert | TV & Movie Airing Tracker</title>
  <link rel="manifest" href="manifest.json">
  <meta name="theme-color" content="#090d16">
  
  <!-- Tailwind CSS CDN -->
  <script src="https://cdn.tailwindcss.com"></script>

  <!-- Parse SDK -->
  <script src="https://npmcdn.com/parse/dist/parse.min.js"></script>

  <!-- Custom Glassmorphism Styles -->
  <style>
    .glass-panel {
      background: rgba(15, 23, 42, 0.65);
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
      border: 1px solid rgba(255, 255, 255, 0.08);
    }
    .glass-card {
      background: rgba(30, 41, 59, 0.45);
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      border: 1px solid rgba(255, 255, 255, 0.06);
      transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
    }
    .glass-card:hover {
      background: rgba(30, 41, 59, 0.65);
      border-color: rgba(255, 255, 255, 0.15);
      transform: translateY(-3px);
    }
    .glass-input {
      background: rgba(15, 23, 42, 0.5);
      backdrop-filter: blur(8px);
      border: 1px solid rgba(255, 255, 255, 0.1);
    }
    .glass-input:focus {
      border-color: rgba(59, 130, 246, 0.5);
      background: rgba(15, 23, 42, 0.75);
    }
  </style>
</head>
<body class="min-h-full flex flex-col font-sans antialiased bg-[radial-gradient(ellipse_at_top,_var(--tw-gradient-stops))] from-slate-900 via-slate-950 to-black">

  <!-- Header / Navigation -->
  <header class="sticky top-0 z-50 glass-panel border-b border-white/10">
    <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 h-20 flex items-center justify-between gap-4">
      
      <!-- Brand Logo -->
      <div class="flex items-center gap-3">
        <div class="p-2.5 rounded-xl bg-blue-500/10 border border-blue-500/20 text-blue-400">
          <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.75" d="M6 20.25h12m-7.5-3v3m3-3v3m-10.125-3h17.25c.621 0 1.125-.504 1.125-1.125V4.875c0-.621-.504-1.125-1.125-1.125H3.375c-.621 0-1.125.504-1.125 1.125v11.25c0 .621.504 1.125 1.125 1.125z" />
          </svg>
        </div>
        <div>
          <span class="text-xl font-bold tracking-tight text-white block leading-none">CineAlert</span>
          <span class="text-xs text-slate-400">TV Episode & Airing Tracker</span>
        </div>
      </div>

      <!-- Master Alert Button -->
      <button 
        id="main-push-btn" 
        type="button"
        class="flex items-center gap-2.5 glass-panel px-4 py-2.5 rounded-full border border-white/10 hover:border-white/20 hover:bg-slate-800/50 transition-all cursor-pointer select-none active:scale-95"
      >
        <svg id="main-bell-icon" class="w-5 h-5 text-slate-400 transition-colors" fill="none" stroke="currentColor" viewBox="0 0 24 24">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.75" d="M14.857 17.082a23.848 23.848 0 005.454-1.31A8.967 8.967 0 0118 9.75v-.7V9A6 6 0 006 9v.75a8.967 8.967 0 01-2.312 6.022c1.733.64 3.56 1.085 5.455 1.31m5.714 0a24.255 24.255 0 01-5.714 0m5.714 0a3 3 0 01-5.714 0" />
        </svg>
        <span id="main-push-status" class="text-xs sm:text-sm font-medium text-slate-300">Push Alerts Off</span>
      </button>

    </div>
  </header>

  <!-- Main Content Layout -->
  <main class="flex-grow max-w-7xl w-full mx-auto px-4 sm:px-6 lg:px-8 py-8 space-y-12">

    <!-- Search Section -->
    <section class="space-y-4">
      <div class="relative max-w-2xl mx-auto">
        <div class="absolute inset-y-0 left-0 pl-4 flex items-center pointer-events-none text-slate-400">
          <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M21 21l-5.197-5.197m0 0A7.5 7.5 0 105.196 5.196a7.5 7.5 0 0010.607 10.607z" />
          </svg>
        </div>
        <input 
          type="text" 
          id="show-search" 
          placeholder="Search TV shows (e.g., Severance, House of the Dragon)..." 
          class="w-full pl-11 pr-4 py-3.5 rounded-2xl glass-input text-slate-100 placeholder-slate-400 focus:outline-none transition-all text-sm sm:text-base shadow-lg"
        >
      </div>
    </section>

    <!-- Catalog Gallery Section -->
    <section class="space-y-6">
      <div class="flex items-center justify-between border-b border-white/5 pb-4">
        <div class="flex items-center gap-2">
          <svg class="w-5 h-5 text-blue-400" fill="none" stroke="currentColor" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15.362 5.214A8.252 8.252 0 0112 21 8.25 8.25 0 016.038 7.048 8.287 8.287 0 009 9.6a8.983 8.983 0 013.361-6.867 8.21 8.21 0 003 2.48z" />
          </svg>
          <h2 class="text-lg font-semibold text-white tracking-wide">Browse Catalog</h2>
        </div>
        <span id="results-count" class="text-xs text-slate-400 font-medium">Trending Shows</span>
      </div>

      <!-- Gallery Grid -->
      <div id="shows-container" class="grid grid-cols-2 sm:grid-cols-3 md:grid-cols-4 lg:grid-cols-5 gap-5">
        <div class="col-span-full py-12 text-center text-slate-400 font-medium glass-card rounded-2xl">
          Loading catalog...
        </div>
      </div>

      <!-- Pagination -->
      <div id="gallery-pagination" class="flex items-center justify-center gap-4 pt-4">
        <button id="prev-page-btn" disabled class="px-4 py-2 rounded-xl glass-panel text-xs font-medium text-slate-300 hover:text-white disabled:opacity-40 disabled:cursor-not-allowed flex items-center gap-1 transition">
          <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15.75 19.5L8.25 12l7.5-7.5" />
          </svg>
          Previous
        </button>
        <span id="page-indicator" class="text-xs font-medium text-slate-400">Page 1</span>
        <button id="next-page-btn" class="px-4 py-2 rounded-xl glass-panel text-xs font-medium text-slate-300 hover:text-white disabled:opacity-40 disabled:cursor-not-allowed flex items-center gap-1 transition">
          Next
          <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M8.25 4.5l7.5 7.5-7.5 7.5" />
          </svg>
        </button>
      </div>
    </section>

    <!-- Tracked Shows & Recent Activity -->
    <section class="space-y-6 pt-4">
      <div class="flex items-center justify-between border-b border-white/5 pb-4">
        <div class="flex items-center gap-2">
          <svg class="w-5 h-5 text-blue-400" fill="none" stroke="currentColor" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 6v6h4.5m4.5 0a9 9 0 11-18 0 9 9 0 0118 0z" />
          </svg>
          <h2 class="text-lg font-semibold text-white tracking-wide">Tracked Shows & Upcoming Episodes</h2>
        </div>
      </div>

      <!-- Activity Feed Grid -->
      <div id="activity-container" class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-5">
        <div class="col-span-full py-8 text-center text-slate-400 font-medium glass-card rounded-2xl">
          Enable push alerts to view tracked shows.
        </div>
      </div>
    </section>

  </main>

  <!-- Footer -->
  <footer class="mt-auto border-t border-white/5 py-6 glass-panel">
    <div class="max-w-7xl mx-auto px-4 text-center text-xs text-slate-500">
      Data provided by TMDB. CineAlert is powered by Parse and WebPush.
    </div>
  </footer>

  <script src="index.js"></script>
</body>
</html>
