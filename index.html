<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Liquid Glass Gallery</title>
  <script src="https://npmcdn.com/parse/dist/parse.min.js"></script>
  <style>
    :root {
      --glass: rgba(255, 255, 255, 0.07);
      --border: rgba(255, 255, 255, 0.15);
      --blur: blur(20px);
      --liquid: linear-gradient(135deg, rgba(255,255,255,0.15) 0%, rgba(255,255,255,0) 40%, rgba(255,255,255,0.05) 100%);
    }

    body {
      margin: 0;
      font-family: 'Inter', sans-serif;
      background: radial-gradient(circle at top, #1a1c2c, #0d0e14);
      background-attachment: fixed;
      color: #fff;
      min-height: 100vh;
    }

    /* Gloss Condensation Effect */
    .glossy {
      position: relative;
      background: var(--glass);
      backdrop-filter: var(--blur);
      -webkit-backdrop-filter: var(--blur);
      border: 1px solid var(--border);
      box-shadow: 0 10px 40px rgba(0,0,0,0.5);
      overflow: hidden;
    }

    .glossy::after {
      content: "";
      position: absolute;
      inset: 0;
      background: var(--liquid);
      pointer-events: none;
    }

    header {
      position: sticky;
      top: 0; z-index: 100;
      padding: 15px 30px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      flex-wrap: wrap;
      gap: 15px;
      border-bottom: 1px solid var(--border);
    }

    .controls { display: flex; gap: 10px; align-items: center; }

    .toggle-box {
      display: flex;
      background: rgba(0,0,0,0.4);
      padding: 4px;
      border-radius: 12px;
      border: 1px solid var(--border);
    }

    .tgl {
      padding: 8px 18px;
      border-radius: 8px;
      border: none;
      background: transparent;
      color: #777;
      cursor: pointer;
      font-weight: 700;
      transition: 0.3s;
    }

    .tgl.active { background: rgba(255,255,255,0.1); color: #fff; }

    input, select {
      background: rgba(255,255,255,0.05);
      border: 1px solid var(--border);
      color: #fff;
      padding: 10px;
      border-radius: 10px;
      outline: none;
    }

    .recent-section { padding: 20px 30px; max-width: 1400px; margin: 0 auto; }
    .recent-scroll { display: flex; gap: 15px; overflow-x: auto; padding-bottom: 15px; }

    .recent-card {
      min-width: 300px;
      padding: 15px;
      border-radius: 18px;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .recent-info .name { font-weight: 700; display: block; margin-bottom: 4px; color: #00d4ff; }
    .recent-info .sub-date { font-size: 0.75rem; color: #aaa; }
    .recent-info .ep { font-size: 0.7rem; margin-top: 8px; color: #ddd; }

    .del-btn {
      background: rgba(255, 70, 70, 0.15);
      border: 1px solid rgba(255,70,70,0.3);
      color: #ff6b6b;
      padding: 8px;
      border-radius: 10px;
      cursor: pointer;
    }

    .gallery {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(220px, 1fr));
      gap: 25px;
      padding: 30px;
      max-width: 1400px;
      margin: 0 auto;
    }

    .card { border-radius: 20px; transition: 0.3s; }
    .card:hover { transform: translateY(-5px); }
    .card img { width: 100%; height: 320px; object-fit: cover; border-bottom: 1px solid var(--border); }
    .card-body { padding: 15px; }
    .card-title { font-weight: 700; margin-bottom: 10px; font-size: 1rem; }

    .sub-btn {
      width: 100%;
      padding: 12px;
      border: none;
      border-radius: 10px;
      background: linear-gradient(135deg, #0072ff, #00c6ff);
      color: #fff;
      font-weight: 700;
      cursor: pointer;
    }
    .sub-btn.active { background: rgba(255,255,255,0.1); border: 1px solid var(--border); cursor: default; }

    .icon { width: 18px; height: 18px; fill: currentColor; }
  </style>
</head>
<body>

<header class="glossy">
  <div style="font-size: 1.5rem; font-weight: 900;">GLOSS</div>
  <div class="controls">
    <div class="toggle-box">
      <button id="mBtn" class="tgl" onclick="setMode('movie')">MOVIES</button>
      <button id="tBtn" class="tgl active" onclick="setMode('tv')">TV</button>
    </div>
    <input type="text" id="q" placeholder="Instant Search..." oninput="dbnc()">
    <select id="g" onchange="search()"><option value="">All Genres</option></select>
    <select id="y" onchange="search()"><option value="">Any Year</option></select>
  </div>
</header>

<div class="recent-section">
  <div class="recent-scroll" id="recents"></div>
</div>

<div class="gallery" id="gal"></div>

<script>
  const TMDB = '1070730380f5fee0d87cf0382670b255';
  Parse.initialize('gH0Ry12pUmKdlIWwjbDtN5T8lCkoZnfD6Xp9rvoq', 'bSh7EVVqy3oQMUup6qDZQBVax28RmVeGgE92tMlp');
  Parse.serverURL = 'https://parseapi.back4app.com/';

  let mode = 'tv', timeout = null;

  function setMode(m) {
    mode = m;
    document.getElementById('mBtn').classList.toggle('active', m === 'movie');
    document.getElementById('tBtn').classList.toggle('active', m === 'tv');
    loadGenres();
    search();
  }

  function dbnc() { clearTimeout(timeout); timeout = setTimeout(search, 500); }

  function fmt(d) {
    if (!d) return 'N/A';
    const date = new Date(d);
    return `${date.getUTCMonth() + 1}/${date.getUTCDate()}/${date.getUTCFullYear()}`;
  }

  async function loadGenres() {
    const r = await fetch(`https://api.themoviedb.org/3/genre/${mode}/list?api_key=${TMDB}`);
    const d = await r.json();
    const sel = document.getElementById('g');
    sel.innerHTML = '<option value="">All Genres</option>';
    d.genres.forEach(g => { sel.innerHTML += `<option value="${g.id}">${g.name}</option>`; });
  }

  async function search() {
    const q = document.getElementById('q').value;
    const g = document.getElementById('g').value;
    const y = document.getElementById('y').value;
    const container = document.getElementById('gal');
    container.innerHTML = 'Loading...';

    let url = q 
      ? `https://api.themoviedb.org/3/search/${mode}?api_key=${TMDB}&query=${q}`
      : `https://api.themoviedb.org/3/discover/${mode}?api_key=${TMDB}&sort_by=popularity.desc`;
    
    if (y) url += mode === 'movie' ? `&primary_release_year=${y}` : `&first_air_date_year=${y}`;
    if (!q && g) url += `&with_genres=${g}`;

    const res = await fetch(url);
    const data = await res.json();
    let items = data.results || [];
    if (q && g) items = items.filter(i => i.genre_ids.includes(parseInt(g)));

    container.innerHTML = '';
    const subs = JSON.parse(localStorage.getItem('subs') || '[]');

    items.forEach(i => {
      const isSub = subs.includes(i.id.toString());
      const card = document.createElement('div');
      card.className = 'card glossy';
      card.innerHTML = `
        <img src="https://image.tmdb.org/t/p/w500${i.poster_path}" alt="poster">
        <div class="card-body">
          <div class="card-title">${i.title || i.name}</div>
          <button class="sub-btn ${isSub ? 'active' : ''}" onclick="subscribe('${i.id}', '${(i.title || i.name).replace(/'/g, "")}', this)" ${isSub ? 'disabled' : ''}>
            ${isSub ? 'Subscribed ✓' : 'Subscribe Alerts'}
          </button>
        </div>
      `;
      container.appendChild(card);
    });
  }

  async function subscribe(id, name, btn) {
    const sw = await navigator.serviceWorker.ready;
    const s = await sw.pushManager.subscribe({
      userVisibleOnly: true,
      applicationServerKey: 'BC-LY0azo2sZzvZ4ZoQnZwnpLpIwhrOFsDTQ9YbiuSdWLNqKQYdNGmMM9Am6IH-Zd9rBPg7gcXOEYiFyNsz2Fh8'
    });
    const Obj = Parse.Object.extend("PushSubscription");
    const sub = new Obj();
    sub.set("subscriptionObject", JSON.parse(JSON.stringify(s)));
    sub.set("showId", id.toString());
    sub.set("showName", name);
    await sub.save();
    
    let subs = JSON.parse(localStorage.getItem('subs') || '[]');
    subs.push(id.toString());
    localStorage.setItem('subs', JSON.stringify(subs));
    btn.className = 'sub-btn active';
    btn.textContent = 'Subscribed ✓';
    loadRecents();
  }

  async function loadRecents() {
    const res = await Parse.Cloud.run('getRecentSubscriptions');
    const container = document.getElementById('recents');
    container.innerHTML = '';
    for (const s of res) {
      let l = 'N/A', n = 'None';
      try {
        const r = await fetch(`https://api.themoviedb.org/3/tv/${s.showId}?api_key=${TMDB}`);
        const d = await r.json();
        l = fmt(d.last_air_date);
        if(d.next_episode_to_air) n = fmt(d.next_episode_to_air.air_date);
      } catch(e) {}

      const div = document.createElement('div');
      div.className = 'recent-card glossy';
      div.innerHTML = `
        <div class="recent-info">
          <span class="name">${s.showName}</span>
          <span class="sub-date">Subscribed: ${fmt(s.date)}</span>
          <div class="ep">Last: ${l} | Next: ${n}</div>
        </div>
        <button class="del-btn" onclick="delSub('${s.showId}')">
          <svg class="icon" viewBox="0 0 20 20" fill="currentColor"><path fill-rule="evenodd" d="M9 2a1 1 0 00-.894.553L7.382 4H4a1 1 0 000 2v10a2 2 0 002 2h8a2 2 0 002-2V6a1 1 0 100-2h-3.382l-.724-1.447A1 1 0 0011 2H9zM7 8a1 1 0 012 0v6a1 1 0 11-2 0V8zm5-1a1 1 0 00-1 1v6a1 1 0 102 0V8a1 1 0 00-1-1z" clip-rule="evenodd" /></svg>
        </button>
      `;
      container.appendChild(div);
    }
  }

  async function delSub(id) {
    await Parse.Cloud.run('deleteSubscriptionByShowId', { showId: id });
    let subs = JSON.parse(localStorage.getItem('subs') || '[]').filter(i => i !== id);
    localStorage.setItem('subs', JSON.stringify(subs));
    loadRecents();
    search();
  }

  window.onload = () => {
    const y = document.getElementById('y');
    for(let i=2027; i>=1950; i--) y.innerHTML += `<option value="${i}">${i}</option>`;
    loadGenres();
    search();
    loadRecents();
    if('serviceWorker' in navigator) navigator.serviceWorker.register('sw.js');
  };
</script>
</body>
</html>
