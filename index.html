<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Glassmorphic Media Gallery</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600&display=swap" rel="stylesheet">
    <style>
        :root {
            --blur-amount: 10px;
            --glass-bg: rgba(255, 255, 255, 0.15);
            --card-bg: rgba(255, 255, 255, 0.08);
            --border-color: rgba(255, 255, 255, 0.2);
            --text-color: #fff;
            --shadow-color: rgba(0, 0, 0, 0.2);
            --accent-color: #00bcd4; /* A teal accent for buttons */
        }

        body {
            font-family: 'Poppins', sans-serif;
            background: linear-gradient(to right, #6a11cb, #2575fc);
            color: var(--text-color);
            margin: 0;
            padding: 20px;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            overflow-x: hidden;
        }

        .container {
            width: 100%;
            max-width: 1400px;
            margin: 0 auto;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        h1 {
            font-size: 2.5em;
            margin-bottom: 20px;
            text-shadow: 2px 2px 8px var(--shadow-color);
        }

        .controls {
            display: flex;
            flex-wrap: wrap;
            justify-content: center;
            gap: 15px;
            margin-bottom: 30px;
            padding: 20px;
            background: var(--glass-bg);
            border-radius: 15px;
            box-shadow: 0 8px 32px 0 var(--shadow-color);
            backdrop-filter: blur(var(--blur-amount));
            -webkit-backdrop-filter: blur(var(--blur-amount));
            border: 1px solid var(--border-color);
            width: 100%;
            max-width: 900px;
        }

        .controls input[type="text"],
        .controls select {
            padding: 12px 15px;
            border: 1px solid var(--border-color);
            border-radius: 8px;
            background: var(--card-bg);
            color: var(--text-color);
            font-size: 1em;
            width: 180px; /* Fixed width for controls */
            box-shadow: inset 0 2px 4px 0 var(--shadow-color);
            backdrop-filter: blur(5px);
        }

        .controls input[type="text"]::placeholder {
            color: rgba(255, 255, 255, 0.7);
        }

        .controls select {
            appearance: none; /* Remove default arrow */
            background-image: url('data:image/svg+xml;charset=US-ASCII,<svg xmlns="http://www.w3.org/2000/svg" width="16" height="12" viewBox="0 0 16 12"><polygon fill="%23ffffff" points="7 10 3 6 1 8 8 15 15 8 13 6"/></svg>');
            background-repeat: no-repeat;
            background-position: right 10px center;
            background-size: 12px 10px;
        }

        .controls button,
        .card button {
            padding: 12px 25px;
            border: none;
            border-radius: 8px;
            background-color: var(--accent-color);
            color: white;
            font-size: 1em;
            cursor: pointer;
            transition: all 0.3s ease;
            box-shadow: 0 4px 15px 0 var(--shadow-color);
            font-weight: 600;
        }

        .controls button:hover,
        .card button:hover {
            background-color: #0097a7; /* Darker accent on hover */
            transform: translateY(-2px);
            box-shadow: 0 6px 20px 0 var(--shadow-color);
        }

        .gallery {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(250px, 1fr));
            gap: 30px;
            width: 100%;
            padding: 20px;
            margin-top: 20px;
        }

        .card {
            background: var(--card-bg);
            border-radius: 15px;
            overflow: hidden;
            box-shadow: 0 8px 32px 0 var(--shadow-color);
            backdrop-filter: blur(var(--blur-amount));
            -webkit-backdrop-filter: blur(var(--blur-amount));
            border: 1px solid var(--border-color);
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            transition: transform 0.3s ease, box-shadow 0.3s ease;
            position: relative; /* For overlay */
        }

        .card:hover {
            transform: translateY(-5px);
            box-shadow: 0 12px 40px 0 var(--shadow-color);
        }

        .card img {
            width: 100%;
            height: 350px; /* Fixed height for images */
            object-fit: cover;
            display: block;
        }

        .card-content {
            padding: 15px;
            flex-grow: 1;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
        }

        .card-title {
            font-size: 1.2em;
            font-weight: 600;
            margin-bottom: 5px;
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
        }

        .card-meta {
            font-size: 0.9em;
            color: rgba(255, 255, 255, 0.8);
            margin-bottom: 10px;
        }

        .card-description {
            font-size: 0.85em;
            color: rgba(255, 255, 255, 0.7);
            display: -webkit-box;
            -webkit-line-clamp: 3;
            -webkit-box-orient: vertical;
            overflow: hidden;
        }

        .card-actions {
            padding: 15px;
            text-align: center;
            border-top: 1px solid var(--border-color);
            background: var(--card-bg); /* Slightly different bg for actions */
        }

        .card .subscribe-btn {
            background-color: var(--accent-color);
            width: calc(100% - 30px); /* Full width minus padding */
            margin: 0 auto;
        }
        .card .subscribe-btn:hover {
            background-color: #0097a7;
        }

        /* Loading and Error States */
        .loading-message,
        .error-message {
            text-align: center;
            padding: 50px;
            font-size: 1.2em;
            width: 100%;
        }
        .error-message {
            color: #ff4d4d;
        }

        /* Responsive Adjustments */
        @media (max-width: 768px) {
            h1 {
                font-size: 2em;
            }
            .controls {
                flex-direction: column;
                align-items: center;
                width: 95%;
            }
            .controls input[type="text"],
            .controls select {
                width: 100%;
                max-width: 300px;
            }
            .gallery {
                grid-template-columns: repeat(auto-fill, minmax(200px, 1fr));
                gap: 20px;
            }
            .card img {
                height: 280px;
            }
        }

        @media (max-width: 480px) {
            h1 {
                font-size: 1.8em;
            }
            .card-title {
                font-size: 1.1em;
            }
            .card-meta, .card-description {
                font-size: 0.8em;
            }
            .controls button, .card button {
                font-size: 0.9em;
                padding: 10px 20px;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>Glassmorphic Media Gallery</h1>

        <div class="controls">
            <input type="text" id="search-input" placeholder="Search Movies & TV...">
            <select id="genre-select">
                <option value="">All Genres</option>
            </select>
            <select id="year-select">
                <option value="">All Years</option>
            </select>
            <button id="search-button">Search</button>
            <button id="alert-button">Trigger Test Alert</button>
        </div>

        <div id="media-gallery" class="gallery">
            <!-- Media cards will be loaded here -->
            <div class="loading-message">Loading media...</div>
        </div>
    </div>




    <!-- Before your script block -->
<script src="https://unpkg.com/parse/dist/parse.min.js"></script>
<script>
    Parse.initialize("gH0Ry12pUmKdlIWwjbDtN5T8lCkoZnfD6Xp9rvoq", "bSh7EVVqy3oQMUup6qDZQBVax28RmVeGgE92tMlp");
    // If using a custom domain for Parse Server:
    // Parse.serverURL = 'YOUR_CUSTOM_SERVER_URL';
</script>


    
    <script>
        // --- Configuration ---
        const TMDB_API_KEY = '1070730380f5fee0d87cf0382670b255';
        const BASE_URL = 'https://api.themoviedb.org/3';
        const IMAGE_BASE_URL = 'https://image.tmdb.org/t/p/w500'; // TMDB image base URL

        // --- DOM Elements ---
        const gallery = document.getElementById('media-gallery');
        const searchInput = document.getElementById('search-input');
        const genreSelect = document.getElementById('genre-select');
        const yearSelect = document.getElementById('year-select');
        const searchButton = document.getElementById('search-button');
        const alertButton = document.getElementById('alert-button');

        // --- State Variables ---
        let allGenres = [];
        let currentMediaType = 'movie'; // Default to movie, can toggle
        let currentPage = 1;
        let totalPages = 1;
        let currentQuery = '';
        let currentGenre = '';
        let currentYear = '';

        // --- Helper Functions ---

        // Fetch data from TMDB API
        async function fetchTmdb(endpoint, params = {}) {
            const url = `${BASE_URL}${endpoint}`;
            params.api_key = TMDB_API_KEY;
            if (!params.language) params.language = 'en-US'; // Default language

            const queryString = new URLSearchParams(params).toString();
            const fullUrl = `${url}?${queryString}`;

            try {
                const response = await fetch(fullUrl);
                if (!response.ok) {
                    if (response.status === 401) { // Unauthorized - check API key
                        throw new Error('Invalid TMDB API Key. Please check your configuration.');
                    } else if (response.status === 429) { // Too Many Requests
                        throw new Error('TMDB API rate limit exceeded. Please try again later.');
                    }
                    throw new Error(`HTTP error! status: ${response.status}`);
                }
                const data = await response.json();
                return data;
            } catch (error) {
                console.error("Fetch Error:", error);
                gallery.innerHTML = `<div class="error-message">Error loading media: ${error.message}</div>`;
                throw error; // Re-throw to be caught by calling functions
            }
        }

        // Get media name and description based on type
        function getMediaInfo(item) {
            if (item.media_type === 'tv' || item.first_air_date) { // TV Show
                return {
                    title: item.name,
                    year: item.first_air_date ? new Date(item.first_air_date).getFullYear() : 'N/A',
                    description: item.overview || 'No description available.',
                    poster: item.poster_path ? `${IMAGE_BASE_URL}${item.poster_path}` : 'placeholder.png', // Add a placeholder image path
                    mediaType: 'tv',
                    id: item.id
                };
            } else { // Movie
                return {
                    title: item.title,
                    year: item.release_date ? new Date(item.release_date).getFullYear() : 'N/A',
                    description: item.overview || 'No description available.',
                    poster: item.poster_path ? `${IMAGE_BASE_URL}${item.poster_path}` : 'placeholder.png', // Add a placeholder image path
                    mediaType: 'movie',
                    id: item.id
                };
            }
        }

        // Create a media card HTML element
        function createMediaCard(item) {
            const mediaInfo = getMediaInfo(item);

            const card = document.createElement('div');
            card.classList.add('card');
            card.innerHTML = `
                <img src="${mediaInfo.poster}" alt="${mediaInfo.title}">
                <div class="card-content">
                    <div class="card-title">${mediaInfo.title}</div>
                    <div class="card-meta">${mediaInfo.mediaType === 'tv' ? 'TV Show' : 'Movie'} | ${mediaInfo.year}</div>
                    <p class="card-description">${mediaInfo.description}</p>
                </div>
                <div class="card-actions">
                    <button class="subscribe-btn" data-id="${mediaInfo.id}" data-type="${mediaInfo.mediaType}">Subscribe</button>
                </div>
            `;
            return card;
        }

        // Render the media gallery
        function renderGallery(items) {
            gallery.innerHTML = ''; // Clear previous content
            if (!items || items.length === 0) {
                gallery.innerHTML = '<div class="loading-message">No media found for your search criteria.</div>';
                return;
            }
            items.forEach(item => {
                const card = createMediaCard(item);
                gallery.appendChild(card);
            });
            attachEventListeners(); // Re-attach listeners after rendering
        }

        // Fetch and populate genres
        async function fetchAndPopulateGenres() {
            try {
                // Fetch genres for movies
                const movieGenres = await fetchTmdb('/genre/movie/list');
                // Fetch genres for TV shows
                const tvGenres = await fetchTmdb('/genre/tv/list');

                // Combine and map genres to a unique list
                allGenres = [...movieGenres.genres, ...tvGenres.genres].reduce((acc, genre) => {
                    if (!acc.find(g => g.id === genre.id)) {
                        acc.push(genre);
                    }
                    return acc;
                }, []).sort((a, b) => a.name.localeCompare(b.name)); // Sort alphabetically

                allGenres.forEach(genre => {
                    const option = document.createElement('option');
                    option.value = genre.id;
                    option.textContent = genre.name;
                    genreSelect.appendChild(option);
                });
            } catch (error) {
                console.error("Error fetching genres:", error);
                genreSelect.innerHTML = '<option value="">Error loading genres</option>';
            }
        }

        // Populate years dropdown (e.g., last 25 years)
        function populateYears() {
            const currentYear = new Date().getFullYear();
            for (let year = currentYear; year >= currentYear - 25; year--) {
                const option = document.createElement('option');
                option.value = year;
                option.textContent = year;
                yearSelect.appendChild(option);
            }
        }

        // Fetch movies or TV shows
        async function fetchMedia(type = 'movie', query = '', genreId = '', yearValue = '') {
            gallery.innerHTML = '<div class="loading-message">Loading media...</div>';
            let endpoint;
            let params = {
                page: currentPage,
            };

            if (query) {
                endpoint = '/search/multi'; // Search across movies and TV
                params.query = query;
            } else {
                // Discover endpoint for filtering by genre and year
                endpoint = type === 'movie' ? '/discover/movie' : '/discover/tv';
                params.sort_by = 'popularity.desc'; // Default sort
                if (genreId) {
                    params.with_genres = genreId;
                }
                if (yearValue) {
                    const year = parseInt(yearValue);
                    if (type === 'movie') {
                        params.primary_release_year = year;
                    } else { // TV
                        params.first_air_date_year = year;
                    }
                }
            }

            try {
                const data = await fetchTmdb(endpoint, params);
                // TMDB search results for 'multi' include 'media_type'
                // For discover, we know the type from the endpoint
                const items = data.results.map(item => {
                    if (query && !item.media_type) { // If searching multi and item lacks type, infer from known properties
                        if (item.title) item.media_type = 'movie';
                        else if (item.name) item.media_type = 'tv';
                        else return null; // Skip if type cannot be determined
                    }
                    if (!query && type === 'movie') item.media_type = 'movie';
                    if (!query && type === 'tv') item.media_type = 'tv';
                    return item;
                }).filter(item => item !== null); // Remove any items that couldn't be typed

                totalPages = data.total_pages;
                renderGallery(items);
            } catch (error) {
                // Error message is already rendered in fetchTmdb
            }
        }

        // Handle Subscription Button Click
        function handleSubscribeClick(event) {
            if (!event.target.classList.contains('subscribe-btn')) return;

            const mediaId = event.target.dataset.id;
            const mediaType = event.target.dataset.type;
            const userId = Parse.User.current() ? Parse.User.current().id : null;

            if (!userId) {
                alert("Please log in to subscribe to notifications.");
                // Redirect to login or show login modal
                return;
            }

            // Determine the type of subscription object to save (movie or tv)
            // For simplicity, let's assume you have a 'UserSubscription' class that stores
            // both movie and tv show IDs, and you'll need to distinguish them.
            // A better approach might be a separate 'UserMovieSubscription' and 'UserTvSubscription'
            // or a 'type' field in 'UserSubscription'.

            // Let's use a single 'UserSubscription' class with a 'tmdbId' and 'mediaType'
            const UserSubscription = Parse.Object.extend("UserSubscription");
            const subscription = new UserSubscription();

            subscription.set("user", Parse.User.current()); // Save pointer to current user
            subscription.set("tmdbId", parseInt(mediaId));
            subscription.set("mediaType", mediaType); // 'movie' or 'tv'
            subscription.set("subscribedAt", new Date());

            // If it's a TV show, you might want to trigger the Cloud Code to schedule notifications
            // based on its episodes. For movies, you might schedule a notification for its release date.
            // For this example, we'll just save the subscription.
            // Your Back4App Cloud Code 'afterSave("UserSubscription")' trigger should handle scheduling.
            // It will need to be modified to handle both movies and tv shows.

            subscription.save()
                .then(savedSubscription => {
                    alert(`Successfully subscribed to ${mediaType} ID ${mediaId}!`);
                    // Optionally change button text or disable it
                    event.target.textContent = 'Subscribed';
                    event.target.disabled = true;
                    // If it's a TV show, you might also want to fetch its details to
                    // potentially trigger an initial schedule in Cloud Code via a custom function call
                    // or rely on the `afterSave` trigger in your Cloud Code.
                })
                .catch(error => {
                    console.error("Error saving subscription:", error);
                    alert(`Failed to subscribe: ${error.message}`);
                });
        }


        // Handle Search Button Click
        function handleSearch() {
            currentQuery = searchInput.value.trim();
            currentGenre = genreSelect.value;
            currentYear = yearSelect.value;
            currentPage = 1; // Reset to first page on new search

            // Decide if we are searching or discovering
            if (currentQuery) {
                // Search across movies and TV shows
                fetchMedia('multi', currentQuery, '', ''); // Type 'multi' for search
            } else {
                // Use discover based on genre and year, default to movies if no specific type selected
                const mediaType = currentMediaType || 'movie'; // Fallback to movie
                fetchMedia(mediaType, '', currentGenre, currentYear);
            }
        }

        // Attach event listeners
        function attachEventListeners() {
            const subscribeButtons = document.querySelectorAll('.subscribe-btn');
            subscribeButtons.forEach(button => {
                button.addEventListener('click', handleSubscribeClick);
            });
        }

        // --- Initialization ---
        async function init() {
            // Check if Parse is initialized (assuming it is from your setup)
            if (typeof Parse === 'undefined') {
                console.error("Parse SDK not initialized. Ensure it's loaded.");
                gallery.innerHTML = '<div class="error-message">Application initialization failed. Please contact support.</div>';
                return;
            }

            // Check if user is logged in for subscription functionality
            const currentUser = Parse.User.current();
            if (currentUser) {
                console.log("User logged in:", currentUser.get("username"));
                // You might want to fetch user's existing subscriptions here and disable buttons
            } else {
                console.log("No user logged in.");
                // alert("Please log in to manage subscriptions.");
            }

            await fetchAndPopulateGenres();
            populateYears();
            fetchMedia(); // Load popular movies by default
        }

        // --- Event Listeners ---
        searchButton.addEventListener('click', handleSearch);
        alertButton.addEventListener('click', async () => {
            // This is a test button to simulate triggering push notifications.
            // In a real PWA, this would typically involve client-side logic to
            // request notification permissions and subscribe to push notifications.
            // For server-side testing, you could call a Parse Cloud function.

            // Example: Call a Cloud function (if you had one named 'sendTestNotification')
            // Parse.Cloud.run('sendTestNotification', {})
            //     .then(result => alert('Test notification sent! Check your device.'))
            //     .catch(error => alert('Failed to send test notification: ' + error.message));

            // For now, we'll just show a browser notification if permissions are granted
            if (Notification.permission === "granted") {
                new Notification("Test Notification", {
                    body: "This is a test push alert from your media gallery!",
                    icon: "path/to/your/icon.png" // Add a relevant icon
                });
            } else if (Notification.permission !== "denied") {
                Notification.requestPermission().then(permission => {
                    if (permission === "granted") {
                        new Notification("Test Notification", {
                            body: "This is a test push alert from your media gallery!",
                            icon: "path/to/your/icon.png"
                        });
                    } else {
                        alert("Notification permission denied.");
                    }
                });
            } else {
                alert("Notifications are blocked. Please enable them in your browser settings.");
            }
        });

        // Handle genre/year changes to trigger search if no query is active
        genreSelect.addEventListener('change', () => {
            if (!searchInput.value.trim()) {
                handleSearch();
            }
        });
        yearSelect.addEventListener('change', () => {
            if (!searchInput.value.trim()) {
                handleSearch();
            }
        });

        // Initial load
        document.addEventListener('DOMContentLoaded', init);

    </script>
</body>
</html>
