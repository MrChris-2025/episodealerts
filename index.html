<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <link rel="manifest" href="manifest.json" />
  <meta name="theme-color" content="#0d1117" />
  <link rel="icon" href="./icon-512.png" type="image/png" />
  <title>Movie & TV Glass Gallery</title>
  <script src="https://npmcdn.com/parse/dist/parse.min.js"></script>

  <style>
    :root {
      --glass-bg: rgba(255, 255, 255, 0.1);
      --glass-border: rgba(255, 255, 255, 0.2);
      --glass-blur: blur(12px);
      --accent: #00c6ff;
    }
    
    body {
      margin: 0;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      background: linear-gradient(135deg, #1f1c2c, #928dab);
      background-attachment: fixed;
      color: #fff;
      min-height: 100vh;
    }

    header {
      position: sticky;
      top: 0;
      z-index: 100;
      background: var(--glass-bg);
      backdrop-filter: var(--glass-blur);
      -webkit-backdrop-filter: var(--glass-blur);
      border-bottom: 1px solid var(--glass-border);
      padding: 15px 20px;
      display: flex;
      flex-wrap: wrap;
      gap: 15px;
      align-items: center;
      justify-content: space-between;
    }

    /* Recent Subscriptions Section */
    .recent-subs-container {
      padding: 20px 20px 0 20px;
      max-width: 1200px;
      margin: 0 auto;
    }

    .recent-subs-title {
      font-size: 0.9rem;
      text-transform: uppercase;
      letter-spacing: 1px;
      margin-bottom: 10px;
      color: #ddd;
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .recent-subs-list {
      display: flex;
      gap: 10px;
      overflow-x: auto;
      padding-bottom: 10px;
      scrollbar-width: thin;
    }

    .recent-subs-list::-webkit-scrollbar { height: 4px; }
    .recent-subs-list::-webkit-scrollbar-thumb { background: var(--glass-border); border-radius: 10px; }

    .sub-chip {
      background: var(--glass-bg);
      border: 1px solid var(--glass-border);
      padding: 6px 15px;
      border-radius: 20px;
      white-space: nowrap;
      font-size: 0.85rem;
      backdrop-filter: var(--glass-blur);
      animation: fadeIn 0.5s ease forwards;
    }

    @keyframes fadeIn {
      from { opacity: 0; transform: translateX(10px); }
      to { opacity: 1; transform: translateX(0); }
    }

    .controls { display: flex; gap: 10px; flex-wrap: wrap; }

    input, select, button {
      background: rgba(255, 255, 255, 0.15);
      border: 1px solid var(--glass-border);
      color: #fff;
      padding: 8px 12px;
      border-radius: 8px;
      outline: none;
      backdrop-filter: var(--glass-blur);
    }

    button { cursor: pointer; transition: 0.3s; font-weight: bold; }
    button:hover:not(:disabled) { background: rgba(255, 255, 255, 0.3); }

    .gallery {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(200px, 1fr));
      gap: 20px;
      padding: 20px;
      max-width: 1200px;
      margin: 0 auto;
    }

    .card {
      background: var(--glass-bg);
      backdrop-filter: var(--glass-blur);
      -webkit-backdrop-filter: var(--glass-blur);
      border: 1px solid var(--glass-border);
      border-radius: 16px;
      overflow: hidden;
      display: flex;
      flex-direction: column;
      transition: transform 0.3s;
      box-shadow: 0 8px 32px 0 rgba(0, 0, 0, 0.3);
    }

    .card:hover { transform: translateY(-5px); }
    .card img { width: 100%; height: 300px; object-fit: cover; background: #333; }
    .card-info { padding: 15px; display: flex; flex-direction: column; flex-grow: 1; justify-content: space-between; }
    .card-title { font-size: 1.1rem; font-weight: 600; margin-bottom: 5px; }
    .card-type { font-size: 0.8rem; color: #ddd; margin-bottom: 10px; text-transform: uppercase; }

    .subscribe-btn {
      background: linear-gradient(135deg, #00c6ff, #0072ff);
      border: none; width: 100%; padding: 10px; border-radius: 8px; margin-top: 10px; color: white;
    }

    .subscribe-btn.subscribed {
      background: linear-gradient(135deg, #11998e, #38ef7d);
      cursor: default;
    }

    .message { text-align: center; padding: 40px; font-size: 1.2rem; color: #ddd; grid-column: 1 / -1; }
  </style>
</head>
<body>

  <header>
    <h1>GlassGallery</h1>
    <div class="controls">
      <input type="text" id="searchInput" placeholder="Search movies & TV..." />
      <select id="genreSelect"><option value="">All Genres</option></select>
      <select id="yearSelect"><option value="">Any Year</option></select>
      <button onclick="performSearch()">Search</button>
    </div>
  </header>

  <!-- RECENT SUBSCRIPTIONS SECTION -->
  <div class="recent-subs-container" id="recentSubsContainer" style="display: none;">
    <div class="recent-subs-title">🔥 Recently Tracked Shows</div>
    <div class="recent-subs-list" id="recentSubsList">
      <!-- Chips will load here -->
    </div>
  </div>

  <div class="gallery" id="gallery">
    <div class="message">Loading content...</div>
  </div>

  <script>
    const PARSE_APP_ID = 'gH0Ry12pUmKdlIWwjbDtN5T8lCkoZnfD6Xp9rvoq';
    const PARSE_JS_KEY = 'bSh7EVVqy3oQMUup6qDZQBVax28RmVeGgE92tMlp';
    const TMDB_KEY = '1070730380f5fee0d87cf0382670b255';
    const VAPID_PUBLIC_KEY = 'BC-LY0azo2sZzvZ4ZoQnZwnpLpIwhrOFsDTQ9YbiuSdWLNqKQYdNGmMM9Am6IH-Zd9rBPg7gcXOEYiFyNsz2Fh8';

    Parse.initialize(PARSE_APP_ID, PARSE_JS_KEY);
    Parse.serverURL = 'https://parseapi.back4app.com/';

    let swRegistration = null;
    if ('serviceWorker' in navigator && 'PushManager' in window) {
      navigator.serviceWorker.register('sw.js')
      .then(swReg => { swRegistration = swReg; })
      .catch(error => { console.error('Service Worker Error', error); });
    }

    function urlB64ToUint8Array(base64String) {
      const padding = '='.repeat((4 - base64String.length % 4) % 4);
      const base64 = (base64String + padding).replace(/\-/g, '+').replace(/_/g, '/');
      const rawData = window.atob(base64);
      const outputArray = new Uint8Array(rawData.length);
      for (let i = 0; i < rawData.length; ++i) {
        outputArray[i] = rawData.charCodeAt(i);
      }
      return outputArray;
    }

    function getSubscribedShows() {
      const subs = localStorage.getItem('subscribedShows');
      return subs ? JSON.parse(subs) : [];
    }

    function markShowAsSubscribedLocally(showId) {
      const subs = getSubscribedShows();
      if (!subs.includes(showId.toString())) {
        subs.push(showId.toString());
        localStorage.setItem('subscribedShows', JSON.stringify(subs));
      }
    }

    /**
     * FETCH RECENT SUBSCRIPTIONS
     */
    async function loadRecentSubscriptions() {
      try {
        const recent = await Parse.Cloud.run('getRecentSubscriptions');
        const list = document.getElementById('recentSubsList');
        const container = document.getElementById('recentSubsContainer');

        if (recent && recent.length > 0) {
          container.style.display = 'block';
          list.innerHTML = '';
          recent.forEach(item => {
            const chip = document.createElement('div');
            chip.className = 'sub-chip';
            chip.textContent = item.showName;
            list.appendChild(chip);
          });
        }
      } catch (err) {
        console.error('Error fetching recent subscriptions:', err);
      }
    }

    async function subscribeToAlerts(showId, showName, btnElement) {
      if (!swRegistration) return alert('Service worker not registered.');
      try {
        const permission = await Notification.requestPermission();
        if (permission !== 'granted') return alert('Notifications denied.');

        btnElement.disabled = true;
        btnElement.textContent = 'Subscribing...';

        const applicationServerKey = urlB64ToUint8Array(VAPID_PUBLIC_KEY);
        const subscription = await swRegistration.pushManager.subscribe({
          userVisibleOnly: true,
          applicationServerKey: applicationServerKey
        });

        const PushSubClass = Parse.Object.extend("PushSubscription");
        const newSub = new PushSubClass();
        newSub.set("subscriptionObject", JSON.parse(JSON.stringify(subscription)));
        newSub.set("showId", showId.toString());
        newSub.set("showName", showName);
        await newSub.save();
        
        markShowAsSubscribedLocally(showId);
        btnElement.textContent = 'Subscribed ✓';
        btnElement.classList.add('subscribed');
        
        // Refresh the recent list
        loadRecentSubscriptions();
        alert(`Successfully subscribed to ${showName}!`);
      } catch (err) {
        console.error('Subscription error:', err);
        btnElement.disabled = false;
        btnElement.textContent = 'Subscribe Alerts';
      }
    }

    async function populateGenres() {
      try {
        const [movieRes, tvRes] = await Promise.all([
          fetch(`https://api.themoviedb.org/3/genre/movie/list?api_key=${TMDB_KEY}`),
          fetch(`https://api.themoviedb.org/3/genre/tv/list?api_key=${TMDB_KEY}`)
        ]);
        const movieData = await movieRes.json();
        const tvData = await tvRes.json();
        const genreMap = new Map();
        if(movieData.genres) movieData.genres.forEach(g => genreMap.set(g.id, g.name));
        if(tvData.genres) tvData.genres.forEach(g => genreMap.set(g.id, g.name));
        const genreSelect = document.getElementById('genreSelect');
        const sortedGenres = Array.from(genreMap.entries()).sort((a, b) => a[1].localeCompare(b[1]));
        sortedGenres.forEach(([id, name]) => {
          const option = document.createElement('option');
          option.value = id; option.textContent = name;
          genreSelect.appendChild(option);
        });
      } catch (err) { console.error(err); }
    }

    function populateYears() {
      const yearSelect = document.getElementById('yearSelect');
      const currentYear = new Date().getFullYear();
      for (let i = currentYear + 2; i >= 1900; i--) {
        const option = document.createElement('option');
        option.value = i; option.textContent = i;
        yearSelect.appendChild(option);
      }
    }

    function renderGallery(results) {
      const gallery = document.getElementById('gallery');
      gallery.innerHTML = '';
      if (!results || results.length === 0) {
        gallery.innerHTML = '<div class="message">No results found.</div>';
        return;
      }
      const subscribedShows = getSubscribedShows();
      results.forEach(item => {
        const title = item.title || item.name;
        const type = item.media_type === 'movie' ? 'Movie' : 'TV Show';
        const imgPath = item.poster_path ? `https://image.tmdb.org/t/p/w500${item.poster_path}` : 'https://via.placeholder.com/500x750?text=No+Image';
        const releaseDate = item.release_date || item.first_air_date || 'N/A';
        const card = document.createElement('div');
        card.className = 'card';
        let subButtonHTML = '';
        if (item.media_type === 'tv' || !item.media_type) {
          const isSubscribed = subscribedShows.includes(item.id.toString());
          if (isSubscribed) {
            subButtonHTML = `<button class="subscribe-btn subscribed" disabled>Subscribed ✓</button>`;
          } else {
            subButtonHTML = `<button class="subscribe-btn" onclick="subscribeToAlerts('${item.id}', '${title.replace(/'/g, "\\'")}', this)">Subscribe Alerts</button>`;
          }
        }
        card.innerHTML = `
          <img src="${imgPath}" alt="${title}" loading="lazy"/>
          <div class="card-info">
            <div><div class="card-title">${title}</div><div class="card-type">${type} | ${releaseDate}</div></div>
            ${subButtonHTML}
          </div>`;
        gallery.appendChild(card);
      });
    }

    async function performSearch() {
      const query = document.getElementById('searchInput').value.trim();
      const genre = document.getElementById('genreSelect').value;
      const year = document.getElementById('yearSelect').value;
      const gallery = document.getElementById('gallery');
      gallery.innerHTML = '<div class="message">Searching...</div>';
      let finalResults = [];
      try {
        if (query) {
          const url = `https://api.themoviedb.org/3/search/multi?api_key=${TMDB_KEY}&query=${encodeURIComponent(query)}&include_adult=false`;
          const response = await fetch(url);
          const data = await response.json();
          finalResults = (data.results || []).filter(r => r.media_type !== 'person');
          if (genre) finalResults = finalResults.filter(item => item.genre_ids && item.genre_ids.includes(parseInt(genre)));
          if (year) finalResults = finalResults.filter(item => (item.release_date || item.first_air_date || '').startsWith(year));
        } else {
          let movieUrl = `https://api.themoviedb.org/3/discover/movie?api_key=${TMDB_KEY}&sort_by=popularity.desc`;
          let tvUrl = `https://api.themoviedb.org/3/discover/tv?api_key=${TMDB_KEY}&sort_by=popularity.desc`;
          if (genre) { movieUrl += `&with_genres=${genre}`; tvUrl += `&with_genres=${genre}`; }
          if (year) { movieUrl += `&primary_release_year=${year}`; tvUrl += `&first_air_date_year=${year}`; }
          const [movieRes, tvRes] = await Promise.all([ fetch(movieUrl), fetch(tvUrl) ]);
          const movies = ((await movieRes.json()).results || []).map(m => ({ ...m, media_type: 'movie' }));
          const tvShows = ((await tvRes.json()).results || []).map(t => ({ ...t, media_type: 'tv' }));
          finalResults = [...movies, ...tvShows].sort((a, b) => b.popularity - a.popularity);
        }
        renderGallery(finalResults);
      } catch (err) { gallery.innerHTML = '<div class="message">Error fetching data.</div>'; }
    }

    document.getElementById('searchInput').addEventListener('keypress', (e) => { if (e.key === 'Enter') performSearch(); });

    window.onload = async () => {
      populateYears();
      await populateGenres();
      performSearch();
      loadRecentSubscriptions();
    };
  </script>
</body>
</html>
