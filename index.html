<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Movie & TV Gallery</title>
    <style>
        :root {
            --primary-color: #ffffff;
            --background-color: #1a1a1a;
            --glass-background: rgba(255, 255, 255, 0.1);
            --glass-border: 1px solid rgba(255, 255, 255, 0.2);
            --shadow: 0 8px 32px 0 rgba(31, 38, 135, 0.37);
        }

        body {
            background-color: var(--background-color);
            color: var(--primary-color);
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            margin: 0;
            padding: 0;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        .header {
            width: 95%;
            padding: 20px;
            text-align: center;
            position: sticky;
            top: 0;
            background: var(--glass-background);
            backdrop-filter: blur(10px);
            border-bottom: var(--glass-border);
            z-index: 10;
            border-radius: 0 0 15px 15px;
        }

        .search-container {
            display: flex;
            justify-content: center;
            gap: 10px;
            margin-top: 15px;
            flex-wrap: wrap;
        }

        .search-container input,
        .search-container select {
            padding: 10px;
            border-radius: 8px;
            border: 1px solid var(--primary-color);
            background: transparent;
            color: var(--primary-color);
        }
        
        #gallery {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(200px, 1fr));
            gap: 20px;
            padding: 20px;
            width: 95%;
        }

        .gallery-item {
            background: var(--glass-background);
            border-radius: 15px;
            overflow: hidden;
            border: var(--glass-border);
            backdrop-filter: blur(5px);
            box-shadow: var(--shadow);
            transition: transform 0.3s ease;
        }

        .gallery-item:hover {
            transform: scale(1.05);
        }

        .gallery-item img {
            width: 100%;
            height: auto;
        }

        .gallery-item .info {
            padding: 15px;
        }

        .subscribe-btn {
            padding: 10px 20px;
            margin-top: 15px;
            border-radius: 8px;
            border: none;
            background-color: #007bff;
            color: white;
            cursor: pointer;
        }
    </style>
</head>
<body>

    <div class="header">
        <h1>Movie & TV Hub</h1>
        <div class="search-container">
            <input type="text" id="search" placeholder="Search for movies or TV shows...">
            <select id="genre">
                <option value="">All Genres</option>
            </select>
            <select id="year">
                <option value="">All Years</option>
            </select>
            <button class="subscribe-btn" id="subscribeBtn">Subscribe for Alerts</button>
        </div>
    </div>

    <div id="gallery"></div>

    <script src="https://npmcdn.com/parse/dist/parse.min.js"></script>
    <script>
        // Initialize Parse
        Parse.initialize("gH0Ry12pUmKdlIWwjbDtN5T8lCkoZnfD6Xp9rvoq", "bSh7EVVqy3oQMUup6qDZQBVax28RmVeGgE92tMlp");
        Parse.serverURL = 'https://parseapi.back4app.com/';

        const apiKey = '1070730380f5fee0d87cf0382670b255';
        const gallery = document.getElementById('gallery');
        const searchInput = document.getElementById('search');
        const genreFilter = document.getElementById('genre');
        const yearFilter = document.getElementById('year');
        const subscribeBtn = document.getElementById('subscribeBtn');
        const VAPID_PUBLIC_KEY = "BC-LY0azo2sZzvZ4ZoQnZwnpLpIwhrOFsDTQ9YbiuSdWLNqKQYdNGmMM9Am6IH-Zd9rBPg7gcXOEYiFyNsz2Fh8";

        async function fetchAndDisplay() {
            const searchTerm = searchInput.value;
            const genreId = genreFilter.value;
            const year = yearFilter.value;
            
            let url = `https://api.themoviedb.org/3/discover/movie?api_key=${apiKey}&sort_by=popularity.desc`;
            if (searchTerm) {
                url = `https://api.themoviedb.org/3/search/multi?api_key=${apiKey}&query=${searchTerm}`;
            } else {
                if(genreId) url += `&with_genres=${genreId}`;
                if(year) url += `&primary_release_year=${year}`;
            }

            try {
                const response = await fetch(url);
                const data = await response.json();
                display(data.results);
            } catch (error) {
                console.error('Error fetching data:', error);
            }
        }

        function display(items) {
            gallery.innerHTML = '';
            items.forEach(item => {
                if (item.poster_path) {
                    const itemElement = document.createElement('div');
                    itemElement.classList.add('gallery-item');
                    itemElement.innerHTML = `
                        <img src="https://image.tmdb.org/t/p/w500${item.poster_path}" alt="${item.title || item.name}">
                        <div class="info">
                            <h3>${item.title || item.name}</h3>
                        </div>
                    `;
                    gallery.appendChild(itemElement);
                }
            });
        }
        
        function urlBase64ToUint8Array(base64String) {
            const padding = '='.repeat((4 - base64String.length % 4) % 4);
            const base64 = (base64String + padding).replace(/-/g, '+').replace(/_/g, '/');
            const rawData = window.atob(base64);
            const outputArray = new Uint8Array(rawData.length);
            for (let i = 0; i < rawData.length; ++i) {
                outputArray[i] = rawData.charCodeAt(i);
            }
            return outputArray;
        }

        async function subscribeUser() {
            try {
                const registration = await navigator.serviceWorker.register('/service-worker.js');
                const subscription = await registration.pushManager.subscribe({
                    userVisibleOnly: true,
                    applicationServerKey: urlBase64ToUint8Array(VAPID_PUBLIC_KEY)
                });

                await Parse.Cloud.run("subscribe", { subscription });
                alert('Successfully subscribed for notifications!');
            } catch (error) {
                console.error('Failed to subscribe the user: ', error);
                alert('Failed to subscribe for notifications.');
            }
        }

        subscribeBtn.addEventListener('click', () => {
            if ('serviceWorker' in navigator && 'PushManager' in window) {
                Notification.requestPermission().then(permission => {
                    if (permission === 'granted') {
                        subscribeUser();
                    }
                });
            } else {
                alert('Push notifications are not supported by your browser.');
            }
        });

        // Other initializations...
        searchInput.addEventListener('input', fetchAndDisplay);
        genreFilter.addEventListener('change', fetchAndDisplay);
        yearFilter.addEventListener('change', fetchAndDisplay);

        fetchAndDisplay();
    </script>
</body>
</html>
