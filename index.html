<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <link rel="manifest" href="manifest.json" />
  <meta name="theme-color" content="#0a0a0c" />
  <link rel="icon" href="./icon-512.png" type="image/png" />
  <title>CinemaDash | Track Your Shows</title>
  
  <!-- Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  
  <script src="https://npmcdn.com/parse/dist/parse.min.js"></script>

  <style>
    :root {
      --bg: #0a0a0c;
      --card-bg: #16161a;
      --accent: #3d5afe;
      --accent-hover: #536dfe;
      --text-main: #ffffff;
      --text-dim: #a1a1aa;
      --danger: #ef4444;
      --success: #22c55e;
    }

    * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }

    body {
      margin: 0;
      font-family: 'Poppins', sans-serif;
      background-color: var(--bg);
      color: var(--text-main);
      line-height: 1.5;
    }

    /* Layout Containers */
    .container { max-width: 1300px; margin: 0 auto; padding: 0 20px; }

    header {
      background: rgba(10, 10, 12, 0.8);
      backdrop-filter: blur(20px);
      position: sticky;
      top: 0;
      z-index: 100;
      padding: 20px 0;
      border-bottom: 1px solid #27272a;
    }

    header .nav-flex {
      display: flex;
      justify-content: space-between;
      align-items: center;
      flex-wrap: wrap;
      gap: 20px;
    }

    h1 { margin: 0; font-size: 1.6rem; font-weight: 700; letter-spacing: -0.5px; }
    h1 span { color: var(--accent); }

    /* Search Bar UI */
    .search-group {
      display: flex;
      flex-direction: column; /* Stack input and toggle on small screens */
      gap: 10px;
      background: #1c1c21;
      border-radius: 12px;
      padding: 5px;
      border: 1px solid #27272a;
      flex-grow: 1;
      max-width: 420px; /* Approximately 70% smaller than 600px */
    }

    .search-input-area {
      display: flex;
      gap: 5px;
      flex-grow: 1;
    }

    .search-group input {
      background: transparent;
      border: none;
      color: #fff;
      padding: 10px 15px;
      flex-grow: 1;
      font-family: inherit;
      outline: none;
    }

    .search-group select {
      background: #27272a;
      border: none;
      color: #fff;
      border-radius: 8px;
      padding: 0 10px;
      margin-right: 5px;
      cursor: pointer;
    }

    /* TV/Movies Toggle */
    .media-type-toggle {
      display: flex;
      background: #27272a;
      border-radius: 8px;
      overflow: hidden;
      flex-shrink: 0; /* Prevent it from shrinking */
    }

    .media-type-toggle input[type="radio"] {
      display: none;
    }

    .media-type-toggle label {
      padding: 8px 12px;
      font-size: 0.85rem;
      cursor: pointer;
      color: var(--text-dim);
      transition: background-color 0.2s, color 0.2s;
      flex: 1;
      text-align: center;
      white-space: nowrap;
    }

    .media-type-toggle input[type="radio"]:checked + label {
      background-color: var(--accent);
      color: var(--text-main);
      font-weight: 500;
    }

    .btn-primary {
      background: var(--accent);
      color: white;
      border: none;
      padding: 10px 20px;
      border-radius: 8px;
      font-weight: 600;
      cursor: pointer;
      transition: 0.2s;
      flex-shrink: 0;
    }

    .btn-primary:hover { background: var(--accent-hover); }

    /* Section Headers */
    .section-label {
      margin: 40px 0 20px;
      font-size: 1.1rem;
      font-weight: 600;
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .section-label::after {
      content: '';
      height: 1px;
      background: #27272a;
      flex-grow: 1;
    }

    /* Tracked Cards Dashboard - Compact */
    .tracked-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
      gap: 15px; /* Reduced gap */
    }

    .tracked-card {
      background: var(--card-bg);
      border-radius: 12px; /* Slightly smaller radius */
      padding: 15px; /* Reduced padding */
      border: 1px solid #27272a;
      display: flex;
      flex-direction: column;
      gap: 8px; /* Reduced gap */
      position: relative;
    }

    .tracked-card .title { font-weight: 600; font-size: 1rem; color: #fff; padding-right: 25px; margin-bottom: 2px; } /* Reduced font size and padding */
    
    .status-badge {
      font-size: 0.7rem; /* Smaller font size */
      padding: 3px 8px; /* Reduced padding */
      border-radius: 16px; /* Smaller radius */
      background: #27272a;
      color: var(--text-dim);
      width: fit-content;
    }

    .episode-info {
      background: #1c1c21;
      border-radius: 8px;
      padding: 8px; /* Reduced padding */
      font-size: 0.8rem; /* Smaller font size */
    }

    .episode-info div { display: flex; justify-content: space-between; margin-bottom: 3px; } /* Reduced margin */
    .episode-info div:last-child { margin-bottom: 0; } /* No margin on last item */
    .episode-info span { color: var(--text-dim); }
    .episode-info b { color: var(--accent); }

    .btn-delete {
      position: absolute;
      top: 10px; /* Adjusted position */
      right: 10px; /* Adjusted position */
      background: rgba(239, 68, 68, 0.1);
      border: none;
      color: var(--danger);
      width: 28px; /* Smaller button */
      height: 28px; /* Smaller button */
      border-radius: 6px; /* Smaller radius */
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      font-weight: bold;
      transition: 0.2s;
      font-size: 1rem;
    }

    .btn-delete:hover { background: var(--danger); color: white; }

    /* Main Gallery Grid */
    .gallery {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(200px, 1fr));
      gap: 25px;
      padding-bottom: 50px;
    }

    .movie-card {
      background: var(--card-bg);
      border-radius: 12px;
      overflow: hidden;
      transition: transform 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275);
    }

    .movie-card:hover { transform: scale(1.03); }

    .poster-wrap { position: relative; aspect-ratio: 2/3; background: #27272a; }
    .poster-wrap img { width: 100%; height: 100%; object-fit: cover; }

    .card-content { padding: 15px; }
    .card-title { font-weight: 600; font-size: 0.95rem; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .card-meta { font-size: 0.8rem; color: var(--text-dim); margin-bottom: 12px; }

    .btn-subscribe {
      width: 100%;
      background: #27272a;
      border: 1px solid #3f3f46;
      color: white;
      padding: 8px;
      border-radius: 8px;
      font-size: 0.85rem;
      font-weight: 500;
      cursor: pointer;
    }

    .btn-subscribe:hover { background: #3f3f46; }
    .btn-subscribe.active { background: var(--success); border-color: var(--success); cursor: default; }

    /* Empty States */
    .empty-msg { text-align: center; color: var(--text-dim); padding: 40px; grid-column: 1/-1; }

    /* Mobile Compatibility */
    @media (max-width: 768px) {
      .gallery { grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); }
      header .nav-flex { flex-direction: column; align-items: stretch; }
      .search-group { max-width: 100%; width: 100%; }
      .search-input-area { flex-wrap: wrap; } /* Allow input and select to wrap */
      .search-group input { flex-grow: 1; min-width: 120px; } /* Ensure input is not too small */
      .search-group select { flex-shrink: 0; }
      .btn-primary { width: 100%; }
      .media-type-toggle { margin-top: 10px; }
    }

    @media (max-width: 480px) {
      h1 { font-size: 1.4rem; }
      .search-group { padding: 8px; }
      .search-group input { padding: 8px 10px; }
      .media-type-toggle { flex-wrap: wrap; }
      .media-type-toggle label { flex: 1 1 auto; min-width: unset; }
      .tracked-card { padding: 12px; }
      .tracked-card .title { font-size: 0.9rem; }
      .episode-info { font-size: 0.75rem; padding: 6px; }
    }
  </style>
</head>
<body>

  <header>
    <div class="container nav-flex">
      <h1>Cinema<span>Dash</span></h1>
      <div class="search-group">
        <div class="search-input-area">
          <input type="text" id="searchInput" placeholder="Search for a show or movie..." />
          <select id="genreSelect"><option value="">All Genres</option></select>
          <button class="btn-primary" onclick="performSearch()">Search</button>
        </div>
        <div class="media-type-toggle">
          <input type="radio" id="toggleAll" name="mediaType" value="all" checked onchange="performSearch()">
          <label for="toggleAll">All</label>
          <input type="radio" id="toggleMovies" name="mediaType" value="movie" onchange="performSearch()">
          <label for="toggleMovies">Movies</label>
          <input type="radio" id="toggleTV" name="mediaType" value="tv" onchange="performSearch()">
          <label for="toggleTV">TV Shows</label>
        </div>
      </div>
    </div>
  </header>

  <main class="container">
    <!-- DASHBOARD: TRACKED SHOWS -->
    <div id="trackedSection" style="display:none;">
      <div class="section-label">Your Tracked Subscriptions</div>
      <div class="tracked-grid" id="trackedGrid"></div>
    </div>

    <!-- MAIN EXPLORE GALLERY -->
    <div class="section-label">Explore Content</div>
    <div class="gallery" id="gallery">
      <div class="empty-msg">Waking up the database...</div>
    </div>
  </main>

  <script>
    const PARSE_APP_ID = 'gH0Ry12pUmKdlIWwjbDtN5T8lCkoZnfD6Xp9rvoq';
    const PARSE_JS_KEY = 'bSh7EVVqy3oQMUup6qDZQBVax28RmVeGgE92tMlp';
    const TMDB_KEY = '1070730380f5fee0d87cf0382670b255';
    const VAPID_PUBLIC_KEY = 'BC-LY0azo2sZzvZ4ZoQnZwnpLpIwhrOFsDTQ9YbiuSdWLNqKQYdNGmMM9Am6IH-Zd9rBPg7gcXOEYiFyNsz2Fh8';

    Parse.initialize(PARSE_APP_ID, PARSE_JS_KEY);
    Parse.serverURL = 'https://parseapi.back4app.com/';

    let swReg = null;
    if ('serviceWorker' in navigator) {
      navigator.serviceWorker.register('sw.js').then(reg => swReg = reg);
    }

    // Local Storage Helpers
    const getLocalSubs = () => JSON.parse(localStorage.getItem('my_subs') || '[]');
    const saveLocalSub = (id) => {
      const s = getLocalSubs();
      if(!s.includes(id)) { s.push(id); localStorage.setItem('my_subs', JSON.stringify(s)); }
    };
    const removeLocalSub = (id) => {
      const s = getLocalSubs().filter(i => i != id);
      localStorage.setItem('my_subs', JSON.stringify(s));
    };

    // Helper to format date to M/D/YYYY
    const formatDate = (dateString) => {
      if (!dateString) return 'N/A';
      try {
        const date = new Date(dateString + 'T00:00:00'); // Add T00:00:00 to ensure UTC interpretation and avoid timezone issues
        // Use toLocaleDateString for more robust formatting, but manually construct for specific format
        const month = date.getUTCMonth() + 1; // getUTCMonth() is 0-indexed
        const day = date.getUTCDate();
        const year = date.getUTCFullYear();
        return `${month}/${day}/${year}`;
      } catch (e) {
        console.error("Error formatting date:", dateString, e);
        return 'N/A';
      }
    };

    /**
     * LOAD DASHBOARD DATA
     * Fetches details from TMDB for each unique subscription
     */
    async function loadDashboard() {
      const grid = document.getElementById('trackedGrid');
      const section = document.getElementById('trackedSection');
      
      try {
        const subs = await Parse.Cloud.run('getRecentSubscriptions');
        if (!subs || subs.length === 0) {
          section.style.display = 'none';
          return;
        }

        section.style.display = 'block';
        grid.innerHTML = '';

        // Fetch TMDB data for each show to get Last/Next Episode
        for (const show of subs) {
          const res = await fetch(`https://api.themoviedb.org/3/tv/${show.showId}?api_key=${TMDB_KEY}`);
          const details = await res.json();
          
          const card = document.createElement('div');
          card.className = 'tracked-card';
          
          const lastEpDate = details.last_episode_to_air ? formatDate(details.last_episode_to_air.air_date) : 'N/A';
          const nextEpDate = details.next_episode_to_air ? formatDate(details.next_episode_to_air.air_date) : 'TBA';
          
          card.innerHTML = `
            <button class="btn-delete" onclick="unsubscribe('${show.showId}')" title="Unsubscribe">×</button>
            <div class="status-badge">Alerts Enabled</div>
            <div class="title">${show.showName}</div>
            <div class="episode-info">
              <div><span>Last Aired:</span> <b>${lastEpDate}</b></div>
              <div><span>Next Episode:</span> <b>${nextEpDate}</b></div>
            </div>
          `;
          grid.appendChild(card);
        }
      } catch (err) { console.error("Dash error:", err); }
    }

    async function subscribe(id, name, btn) {
      if (!swReg) return alert("Push not supported or service worker not registered.");
      try {
        const permission = await Notification.requestPermission();
        if (permission !== 'granted') return alert("Notification permission denied. Cannot track shows.");

        btn.disabled = true;
        btn.textContent = "Syncing...";

        const subObj = await swReg.pushManager.subscribe({
          userVisibleOnly: true,
          applicationServerKey: urlB64ToUint8Array(VAPID_PUBLIC_KEY)
        });

        const PSub = Parse.Object.extend("PushSubscription");
        const ps = new PSub();
        ps.set("subscriptionObject", JSON.parse(JSON.stringify(subObj)));
        ps.set("showId", id.toString());
        ps.set("showName", name);
        await ps.save();

        saveLocalSub(id.toString());
        btn.textContent = "Tracked ✓";
        btn.classList.add('active');
        loadDashboard();
      } catch (e) { 
        console.error("Subscription error:", e);
        alert("Failed to subscribe. Make sure you have allowed notifications and your service worker is correctly configured.");
        btn.disabled = false;
        btn.textContent = "Track Episodes"; // Reset button text on error
      }
    }

    async function unsubscribe(showId) {
      if(!confirm("Stop alerts for this show?")) return;
      try {
        // Find the active push subscription object to remove it from the browser
        let browserSubscription = null;
        if (swReg && swReg.pushManager) {
          browserSubscription = await swReg.pushManager.getSubscription();
        }

        // Send a request to your Parse Server to delete the subscription by showId
        await Parse.Cloud.run('deleteSubscription', { showId: showId, endpoint: browserSubscription ? browserSubscription.endpoint : null });
        
        // Remove from local storage
        removeLocalSub(showId);
        
        // Refresh UI
        loadDashboard();
        performSearch(); // Refresh gallery buttons
        
        // Unsubscribe from the browser if it was a general subscription
        if (browserSubscription) {
          await browserSubscription.unsubscribe();
        }

      } catch (e) { 
        console.error("Unsubscribe error:", e);
        alert("Failed to delete subscription. It might have already been removed or an error occurred."); 
      }
    }

    // Standard TMDB Logic
    async function performSearch() {
      const q = document.getElementById('searchInput').value.trim();
      const g = document.getElementById('genreSelect').value; // Currently not used in API calls
      const mediaTypeFilter = document.querySelector('input[name="mediaType"]:checked').value;
      
      const gallery = document.getElementById('gallery');
      const localSubs = getLocalSubs();
      
      gallery.innerHTML = '<div class="empty-msg">Searching content...</div>';
      
      let results = [];
      let apiUrl = '';

      try {
        if (q) {
          // Search specific media type or multi-search
          if (mediaTypeFilter === 'movie') {
            apiUrl = `https://api.themoviedb.org/3/search/movie?api_key=${TMDB_KEY}&query=${encodeURIComponent(q)}`;
          } else if (mediaTypeFilter === 'tv') {
            apiUrl = `https://api.themoviedb.org/3/search/tv?api_key=${TMDB_KEY}&query=${encodeURIComponent(q)}`;
          } else { // 'all' or default
            apiUrl = `https://api.themoviedb.org/3/search/multi?api_key=${TMDB_KEY}&query=${encodeURIComponent(q)}`;
          }
        } else {
          // Trending specific media type or all
          if (mediaTypeFilter === 'movie') {
            apiUrl = `https://api.themoviedb.org/3/trending/movie/week?api_key=${TMDB_KEY}`;
          } else if (mediaTypeFilter === 'tv') {
            apiUrl = `https://api.themoviedb.org/3/trending/tv/week?api_key=${TMDB_KEY}`;
          } else { // 'all' or default
            apiUrl = `https://api.themoviedb.org/3/trending/all/week?api_key=${TMDB_KEY}`;
          }
        }

        const res = await fetch(apiUrl);
        const data = await res.json();
        results = data.results.filter(i => i.media_type !== 'person'); // Filter out people from results
        
        // If a specific media type filter is applied, also filter out other types if multi-search was used
        if (q && mediaTypeFilter !== 'all') {
          results = results.filter(item => item.media_type === mediaTypeFilter);
        }

        if (results.length === 0) {
            gallery.innerHTML = '<div class="empty-msg">No results found.</div>';
            return;
        }

        gallery.innerHTML = '';
        results.forEach(item => {
          // Determine if it's a TV show, prioritizing 'tv' media_type, or if it has first_air_date
          const isTV = item.media_type === 'tv' || (!item.media_type && item.first_air_date);
          const name = item.name || item.title;
          const date = (item.first_air_date || item.release_date || '').split('-')[0];
          const img = item.poster_path ? `https://image.tmdb.org/t/p/w500${item.poster_path}` : 'https://via.placeholder.com/500x750?text=No+Image';
          
          const card = document.createElement('div');
          card.className = 'movie-card';

          let actionHtml = '';
          // Only show 'Track Episodes' button for TV series
          if (isTV) {
            const isTracked = localSubs.includes(item.id.toString());
            actionHtml = isTracked 
              ? `<button class="btn-subscribe active" disabled>Tracked ✓</button>`
              : `<button class="btn-subscribe" onclick="subscribe('${item.id}', '${name.replace(/'/g, "\\'")}', this)">Track Episodes</button>`;
          }

          card.innerHTML = `
            <div class="poster-wrap"><img src="${img}" loading="lazy"></div>
            <div class="card-content">
              <div class="card-title">${name}</div>
              <div class="card-meta">${isTV ? 'TV Series' : 'Movie'} • ${date || 'TBA'}</div>
              ${actionHtml}
            </div>
          `;
          gallery.appendChild(card);
        });
      } catch (e) { 
        console.error("Search error:", e);
        gallery.innerHTML = '<div class="empty-msg">Failed to load content. Please try again later.</div>'; 
      }
    }

    function urlB64ToUint8Array(base64String) {
      const padding = '='.repeat((4 - base64String.length % 4) % 4);
      const base64 = (base64String + padding).replace(/\-/g, '+').replace(/_/g, '/');
      const rawData = window.atob(base64);
      const outputArray = new Uint8Array(rawData.length);
      for (let i = 0; i < rawData.length; ++i) { outputArray[i] = rawData.charCodeAt(i); }
      return outputArray;
    }

    async function init() {
      // Load Genres (optional, as it's not currently filtering by genre in search)
      const res = await fetch(`https://api.themoviedb.org/3/genre/tv/list?api_key=${TMDB_KEY}`); // Fetch TV genres
      const data = await res.json();
      const sel = document.getElementById('genreSelect');
      data.genres.forEach(gen => {
        const opt = document.createElement('option');
        opt.value = gen.id; opt.textContent = gen.name;
        sel.appendChild(opt);
      });

      performSearch();
      loadDashboard();
    }

    window.onload = init;
  </script>
</body>
</html>
