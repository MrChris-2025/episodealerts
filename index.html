<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>TV Show Episode Alerts</title>
  <link rel="manifest" href="manifest.json">
  <meta name="theme-color" content="#0d253f">
  <link rel="stylesheet" href="style.css">
  <script src="https://npmcdn.com/parse/dist/parse.min.js"></script>
</head>
<body>
  <div class="container">
    <header>
      <h1>📺 TV Episode Alerts</h1>
      <div class="toggle-wrapper">
        <span>Master Push Alerts</span>
        <label class="switch">
          <input type="checkbox" id="main-push-toggle">
          <span class="slider"></span>
        </label>
      </div>
    </header>

    <!-- Show Search Section -->
    <section class="search-section">
      <input type="text" id="show-search" placeholder="Search TV shows (e.g., Breaking Bad, Severance)...">
    </section>

    <!-- Shows Search Results / Trending -->
    <section class="shows-section">
      <h2>Browse & Subscribe</h2>
      <div id="shows-container" class="cards-grid">
        <div class="card">Loading shows...</div>
      </div>
    </section>

    <!-- Backend Recent Activity Feed -->
    <section class="activity-section">
      <h2>Recent Activity & Subscriptions</h2>
      <div id="activity-container" class="activity-grid">
        <div class="card">Loading activity...</div>
      </div>
    </section>
  </div>

  <script src="index.js"></script>
</body>
</html>
