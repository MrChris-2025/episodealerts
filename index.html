<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Movie & TV Gallery</title>
    <style>
        :root {
            --primary-color: #ffffff;
            --background-color: #1a1a1a;
            --glass-background: rgba(255, 255, 255, 0.1);
            --glass-border: 1px solid rgba(255, 255, 255, 0.2);
            --shadow: 0 8px 32px 0 rgba(31, 38, 135, 0.37);
        }
        body { background-color: var(--background-color); color: var(--primary-color); font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; margin: 0; padding: 0; display: flex; flex-direction: column; align-items: center; }
        .header { width: 95%; padding: 20px; text-align: center; position: sticky; top: 0; background: var(--glass-background); backdrop-filter: blur(10px); border-bottom: var(--glass-border); z-index: 10; border-radius: 0 0 15px 15px; }
        .search-container { display: flex; justify-content: center; gap: 10px; margin-top: 15px; flex-wrap: wrap; }
        .search-container input, .search-container select { padding: 10px; border-radius: 8px; border: 1px solid var(--primary-color); background: transparent; color: var(--primary-color); }
        #gallery { display: grid; grid-template-columns: repeat(auto-fill, minmax(200px, 1fr)); gap: 20px; padding: 20px; width: 95%; }
        .gallery-item { background: var(--glass-background); border-radius: 15px; overflow: hidden; border: var(--glass-border); backdrop-filter: blur(5px); box-shadow: var(--shadow); transition: transform 0.3s ease; position: relative; }
        .gallery-item:hover { transform: scale(1.05); }
        .gallery-item img { width: 100%; height: auto; display: block; }
        .gallery-item .info { padding: 15px; }
        .subscribe-btn { padding: 10px 20px; border-radius: 8px; border: none; background-color: #007bff; color: white; cursor: pointer; }
        .item-subscribe-icon { position: absolute; top: 10px; right: 10px; cursor: pointer; width: 32px; height: 32px; background-color: rgba(0,0,0,0.5); border-radius: 50%; padding: 4px; transition: transform 0.2s ease; }
        .item-subscribe-icon:hover { transform: scale(1.2); }
        .item-subscribe-icon svg { stroke: white; }
    </style>
</head>
<body>

    <div class="header">
        <h1>Movie & TV Hub</h1>
        <div class="search-container">
            <input type="text" id="search" placeholder="Search for movies or TV shows...">
            <select id="genre"><option value="">All Genres</option></select>
            <select id="year"><option value="">All Years</option></select>
            <button class="subscribe-btn" id="enableNotificationsBtn">Enable Notifications</button>
        </div>
    </div>

    <div id="gallery"></div>

    <script src="https://npmcdn.com/parse/dist/parse.min.js"></script>
    <script>
        Parse.initialize("gH0Ry12pUmKdlIWwjbDtN5T8lCkoZnfD6Xp9rvoq", "bSh7EVVqy3oQMUup6qDZQBVax28RmVeGgE92tMlp");
        Parse.serverURL = 'https://parseapi.back4app.com/';

        const apiKey = '1070730380f5fee0d87cf0382670b255';
        const VAPID_PUBLIC_KEY = "BC-LY0azo2sZzvZ4ZoQnZwnpLpIwhrOFsDTQ9YbiuSdWLNqKQYdNGmMM9Am6IH-Zd9rBPg7gcXOEYiFyNsz2Fh8";
        
        const gallery = document.getElementById('gallery');
        const searchInput = document.getElementById('search');
        const genreFilter = document.getElementById('genre');
        const yearFilter = document.getElementById('year');
        const enableNotificationsBtn = document.getElementById('enableNotificationsBtn');

        async function fetchAndDisplay() {
            const searchTerm = searchInput.value;
            let url = `https://api.themoviedb.org/3/trending/all/day?api_key=${apiKey}`;
            if (searchTerm) {
                url = `https://api.themoviedb.org/3/search/multi?api_key=${apiKey}&query=${searchTerm}`;
            }
            try {
                const response = await fetch(url);
                const data = await response.json();
                display(data.results);
            } catch (error) { console.error('Error fetching data:', error); }
        }

        function display(items) {
            gallery.innerHTML = '';
            items.forEach(item => {
                if (item.poster_path) {
                    const itemElement = document.createElement('div');
                    itemElement.classList.add('gallery-item');
                    
                    // Show subscribe icon only for TV shows
                    const subscribeIconHtml = item.media_type === 'tv' ? `
                        <div class="item-subscribe-icon" data-tmdb-id="${item.id}" title="Subscribe to new episode alerts">
                            <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="1.5" stroke="currentColor">
                                <path stroke-linecap="round" stroke-linejoin="round" d="M14.857 17.082a23.848 23.848 0 005.454-1.31A8.967 8.967 0 0118 9.75v-.7V9A6 6 0 006 9v.75a8.967 8.967 0 01-2.312 6.022c1.733.64 3.56 1.085 5.455 1.31m5.714 0a24.255 24.255 0 01-5.714 0m5.714 0a3 3 0 11-5.714 0" />
                            </svg>
                        </div>
                    ` : '';

                    itemElement.innerHTML = `
                        ${subscribeIconHtml}
                        <img src="https://image.tmdb.org/t/p/w500${item.poster_path}" alt="${item.title || item.name}">
                        <div class="info">
                            <h3>${item.title || item.name}</h3>
                        </div>
                    `;
                    gallery.appendChild(itemElement);
                }
            });
        }
        
        function urlBase64ToUint8Array(base64String) {
            const padding = '='.repeat((4 - base64String.length % 4) % 4);
            const base64 = (base64String + padding).replace(/-/g, '+').replace(/_/g, '/');
            const rawData = window.atob(base64);
            const outputArray = new Uint8Array(rawData.length);
            for (let i = 0; i < rawData.length; ++i) { outputArray[i] = rawData.charCodeAt(i); }
            return outputArray;
        }

        async function registerDeviceForPush() {
            try {
                await navigator.serviceWorker.register('/service-worker.js');
                const registration = await navigator.serviceWorker.ready;
                const subscription = await registration.pushManager.subscribe({
                    userVisibleOnly: true,
                    applicationServerKey: urlBase64ToUint8Array(VAPID_PUBLIC_KEY)
                });

                await Parse.Cloud.run("subscribe", { subscription });
                alert('Notifications enabled! You can now subscribe to shows.');
                enableNotificationsBtn.style.display = 'none'; // Hide button after success
            } catch (error) {
                console.error('Failed to enable notifications: ', error);
                alert('Failed to enable notifications.');
            }
        }

        async function subscribeToTvShow(tmdbId) {
            const registration = await navigator.serviceWorker.ready;
            const subscription = await registration.pushManager.getSubscription();

            if (!subscription) {
                alert("Please enable notifications first using the button at the top.");
                return;
            }

            try {
                const result = await Parse.Cloud.run("subscribeToItem", { 
                    subscriptionEndpoint: subscription.endpoint,
                    tmdbId: parseInt(tmdbId, 10) 
                });
                alert(result);
            } catch (error) {
                console.error("Failed to subscribe to item:", error);
                alert(`Error: ${error.message}`);
            }
        }

        enableNotificationsBtn.addEventListener('click', () => {
            if ('serviceWorker' in navigator && 'PushManager' in window) {
                Notification.requestPermission().then(permission => {
                    if (permission === 'granted') {
                        registerDeviceForPush();
                    }
                });
            } else { alert('Push notifications are not supported by your browser.'); }
        });

        gallery.addEventListener('click', (event) => {
            const iconContainer = event.target.closest('.item-subscribe-icon');
            if (iconContainer) {
                const tmdbId = iconContainer.dataset.tmdbId;
                subscribeToTvShow(tmdbId);
            }
        });

        // Initializations
        searchInput.addEventListener('input', fetchAndDisplay);
        fetchAndDisplay();
    </script>
</body>
</html>
