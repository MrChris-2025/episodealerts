<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Glass Purple Gallery — Alerts</title>
  <link rel="manifest" href="/manifest.json" />
  <meta name="theme-color" content="#08020a">
  <style>
    :root{
      --bg-dark:#040006;
      --bg-black:#0b0012;
      --purple-1:#6f2bd6;
      --purple-2:#9b59ff;
      --green-1:#16a34a;
      --green-2:#34d399;
      --muted:rgba(230,238,248,0.9);
      --glass-border:rgba(255,255,255,0.04);
      --card-height:260px;
      --max-width:1100px;
    }
    *{box-sizing:border-box}
    html,body{height:100%}
    body{
      margin:0;
      font-family:Inter, system-ui, -apple-system, "Segoe UI", Roboto, Helvetica, Arial;
      background:
        radial-gradient(800px 400px at 10% 10%, rgba(107,43,214,0.12), transparent),
        linear-gradient(180deg,var(--bg-dark),var(--bg-black));
      color:var(--muted);
      display:flex;
      justify-content:center;
      padding:28px;
    }
    .container{width:100%;max-width:var(--max-width)}
    .glass{
      background:linear-gradient(180deg, rgba(255,255,255,0.02), rgba(255,255,255,0.01));
      border-radius:14px;padding:12px;border:1px solid var(--glass-border);
      backdrop-filter: blur(10px) saturate(120%);
      -webkit-backdrop-filter: blur(10px) saturate(120%);
      box-shadow: 0 8px 30px rgba(10,6,20,0.6);
    }

    header.topbar{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:18px}
    .brand{display:flex;gap:12px;align-items:center}
    .logo{width:48px;height:48px;border-radius:12px;display:flex;align-items:center;justify-content:center;color:#fff;font-weight:800;font-size:18px;background:linear-gradient(135deg,var(--purple-1),var(--purple-2));box-shadow:0 6px 18px rgba(111,43,214,0.18)}
    .brand .title{font-weight:800;color:#fff}
    .brand .subtitle{font-size:12px;color:rgba(255,255,255,0.78)}

    .controls{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
    input[type="search"], select{
      padding:10px 12px;border-radius:10px;border:none;background:rgba(255,255,255,0.02);color:var(--muted);min-width:200px;outline:none;
    }
    button.primary{padding:10px 14px;border-radius:12px;border:none;color:#fff;font-weight:700;cursor:pointer;background:linear-gradient(135deg,var(--purple-1),var(--purple-2));box-shadow:0 8px 18px rgba(111,43,214,0.18)}
    button.primary.secondary{background:linear-gradient(135deg, rgba(255,255,255,0.02), rgba(255,255,255,0.01));border:1px solid rgba(255,255,255,0.03);color:var(--muted)}

    main.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(160px,1fr));gap:14px;margin-top:18px}
    .card{position:relative;height:var(--card-height);border-radius:14px;overflow:hidden;background-size:cover;background-position:center;display:flex;align-items:flex-end;padding:12px;transition:transform .18s,box-shadow .18s;border:1px solid rgba(255,255,255,0.03)}
    .card:hover{transform:translateY(-6px);box-shadow:0 18px 40px rgba(11,3,30,0.6)}

    .meta{width:100%;background:linear-gradient(0deg, rgba(4,1,10,0.85), rgba(4,1,10,0.18));padding:10px;border-radius:10px;display:flex;justify-content:space-between;align-items:center;gap:10px;color:#fff}
    .meta .left{display:flex;flex-direction:column;gap:4px}
    .meta .title{font-weight:700;font-size:14px;color:#fff}
    .meta .sub{font-size:12px;color:rgba(255,255,255,0.9)}

    .followBtn{width:46px;height:46px;border-radius:50%;display:inline-flex;align-items:center;justify-content:center;cursor:pointer;border:none;color:#fff;transition:all .12s}
    .followBtn[data-followed="0"]{background:linear-gradient(135deg,var(--purple-1),var(--purple-2));box-shadow:0 10px 28px rgba(111,43,214,0.18)}
    .followBtn[data-followed="1"]{background:linear-gradient(135deg,var(--green-1),var(--green-2));box-shadow:0 10px 28px rgba(16,185,129,0.18)}
    .followBtn svg{width:22px;height:22px;display:block}

    .status-bar{margin-top:10px;font-size:13px;color:var(--muted)}
    .error{color:#ff7b7b;font-weight:700}

    .loader{display:flex;align-items:center;gap:10px;color:var(--muted);font-size:14px;padding:18px;justify-content:center}
    .spinner{width:18px;height:18px;border-radius:50%;border:2px solid rgba(255,255,255,0.08);border-top-color:var(--purple-2);animation:spin 1s linear infinite}
    @keyframes spin{to{transform:rotate(360deg)}}

    footer{margin-top:22px;text-align:center;color:rgba(230,238,248,0.5);font-size:13px}
    @media (max-width:640px){:root{--card-height:200px}.controls{gap:8px}.logo{width:40px;height:40px}}
  </style>
</head>
<body>
  <div class="container">
    <header class="glass topbar">
      <div class="brand">
        <div class="logo">GG</div>
        <div>
          <div class="title">Gallery</div>
          <div class="subtitle">P</div>
        </div>
      </div>

      <div class="controls">
        <input id="searchInput" type="search" placeholder="Search movies & TV..." aria-label="Search" />
        <select id="genreSelect"><option value="">All genres</option></select>
        <select id="yearSelect"><option value="">Any year</option></select>
        <button id="globalSubscribeBtn" class="primary secondary" title="Subscribe for push notifications">Subscribe (Push)</button>
        <button id="testNotifyBtn" class="primary secondary" title="Send test push">Test Notification</button>
      </div>
    </header>

    <div id="statusBar" class="status-bar"></div>

    <main id="gallery" class="grid">
      <div class="loader" id="initialLoader"><div class="spinner" aria-hidden="true"></div><div>Loading trending...</div></div>
    </main>

    <footer>&copy; Glass Purple Gallery</footer>
  </div>

  <script src="https://npmcdn.com/parse/dist/parse.min.js"></script>
  <script src="/main.js"></script>
</body>
</html>
